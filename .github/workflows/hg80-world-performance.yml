name: HG80 World Performance and Native Boss Artwork Release
on:
  workflow_dispatch:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - painter.js
      - app.js
      - qa-hg28-art-chrome.py
      - qa-hg80-map.cjs
      - qa-hg80-world-chrome.py
      - .github/workflows/hg80-world-performance.yml
permissions:
  contents: read
concurrency:
  group: hg80-world-one-html
  cancel-in-progress: true
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact SHA with world culling, native sprites, Save v07 and combat
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check painter.js
          node --check app.js
          node --check qa-hg80-map.cjs
          node qa-hg80-map.cjs
          node qa-hg79-polish.cjs
          node qa-engine.cjs
          node qa-hg75-tactics.cjs
  offline-browser:
    needs: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: One HTML with all original and optimized sprite atlases
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Install actual Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Optimized square world and monster category Chromium tests
        run: python qa-hg80-world-chrome.py
      - name: Retain HG79 world monster art, portraits and Android pinch
        run: python qa-hg79-polish-chrome.py
      - name: Native 40 troop/three Boss atlases on real 16-stack field
        run: python qa-hg28-art-chrome.py
      - name: Original mobile map viewports and touch controls
        run: python qa-hg405-desktop-phone-chrome.py
      - name: Full 8-command combat, surrender and skip regression
        run: python qa-hg75-chrome.py
      - name: Preserve actual evidence from every browser gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG80-Real-Chromium-World-Combat-Perf-Evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            docs/qa/hg80/*.json
            docs/evidence/hg80/*.png
            docs/qa/hg79/*.json
            docs/evidence/hg79/*.png
            docs/qa/hg28/*.json
            docs/evidence/hg28/**/*.png
            docs/qa/hg405/*.json
            docs/evidence/hg405/*.png
            docs/qa/hg75/*.json
            docs/evidence/hg75/*.png
      - name: Deliver single verified playable offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HEOOFGAIA-HG80-WORLD-COMBAT-ONE-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
