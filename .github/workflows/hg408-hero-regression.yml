name: HG40.8 hero dismissal, v07 integrity and real Chromium UI
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg408-hero-management.js'
      - 'app.js'
      - 'style-hg03.css'
      - 'index.html'
      - 'build_offline.py'
      - 'qa-hg408-heromanagement.cjs'
      - 'qa-hg408-hero-chrome.py'
      - '.github/workflows/hg408-hero-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HG40.8 source syntax, hero dismissal and legacy v07 regression
        run: |
          node --check hg408-hero-management.js
          node --check app.js
          node --check qa-hg408-heromanagement.cjs
          node qa-hg408-heromanagement.cjs
          node qa-hg261-joint.cjs
          node qa-hg20-private.cjs
      - name: Build existing single standalone HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Run actual browser QA at desktop and three mobile viewports
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg408-hero-chrome.py
          python qa-hg408-hero-chrome.py
      - name: Upload authentic screenshots and engine/Chromium test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG408-Hero-Management-Real-Evidence
          path: |
            docs/qa/hg408/*.json
            docs/evidence/hg408/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Deliver one offline HTML rebuilt from the tested commit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG408-Playable-Standalone-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
