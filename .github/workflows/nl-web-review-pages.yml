name: Muu Dinh Tam Quoc - One Link Web Review (UI V2)

on:
  push:
    branches:
      - feature/nl-web-review-20261122
  workflow_dispatch:

concurrency:
  group: nl-web-review-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-review:
    name: Build canonical game and capture 28 screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate source and build one canonical HTML
        run: |
          set -euo pipefail
          python qa/nl_wiki_runtime_gap.py --out qa/wiki-runtime-gap.json
          python tools/validate_ngoalong_data.py
          python qa/nl_content_c_projection_test.py
          node --check tools/nl_content_c_runtime.js
          python tools/build_ngoa_long_mode.py
          python tools/build_ngoa_long_r03.py
          python tools/build_ngoa_long_r04.py
          python tools/build_ngoa_long_items_v1.py
          python tools/build_ngoa_long_items_v1.py --check
          python tools/build_ngoa_long_mode.py --check
          python tools/build_ngoa_long_r03.py --check
          python tools/build_ngoa_long_r04.py --check
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          src=Path('index.html').read_text(encoding='utf-8')
          assert len(src)>1_000_000
          assert 'nl-fixed-window-style' not in src, 'Canonical gameplay cannot contain review overlay yet'
          assert 'nl-fixed-window-review-script' not in src, 'Canonical gameplay cannot contain review overlay yet'
          assert 'muu_dinh_tam_quoc_v1' in src
          Path('qa').mkdir(exist_ok=True)
          PY
          git rev-parse HEAD | tee qa/web-review-sha.txt
          sha256sum index.html | tee qa/web-review-html-sha256.txt
          node --check tools/nl_review_window_v2.js
          node --check tools/nl_art_d.js
          node --check tools/nl_art_d2.js
          node --check tools/nl_classic_phase_a.js
          node --check tools/nl_classic_phase_a_research_late.js
          node --check tools/nl_classic_phase_a2.js
          node --check tools/nl_classic_phase_a3.js
          node --check tools/nl_classic_phase_b1.js
          node --test qa/nl_classic_phase_b1.test.cjs
          python -m py_compile tools/nl_classic_phase_b2_native.py qa/nl_classic_phase_b2_browser.py
          python qa/nl_classic_phase_b2_native_test.py
          node --check tools/nl_classic_phase_b3.js
          node --test qa/nl_classic_phase_b3.test.cjs
          node --check tools/nl_classic_world_a4.js
          node --check tools/nl_classic_advanced_a5_a9.js
          node --test qa/nl_classic_world_a4.test.cjs qa/nl_classic_advanced_a5_a9.test.cjs
          python -m py_compile tools/nl_classic_phase_a3_items.py qa/nl_onboarding_30min.py
          python -m py_compile qa/nl_classic_phase_a2_browser.py
      - name: Install approved browser QA dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: D2-D4 native squad raster and VFX smoke (desktop/mobile)
        run: python qa/nl_art_d2_browser.py
      - name: Focused combat, Save v5 and item regression on canonical gameplay
        run: |
          python qa/nl_native_pve_a1_browser.py
          python qa/nl_premerge_hero207_items.py
          python qa/nl_item_integration.py
          node --test qa/nl_item_inventory_group08.test.cjs qa/nl_item_equipment_ui_group08.test.cjs
          python qa/nl_classic_phase_a3_browser.py

      - name: Content C focused native P2 smoke
        run: python qa/nl_content_c_browser.py

      - name: A5-A9 focused live runtime smoke
        run: python qa/nl_classic_advanced_a5_a9_browser.py

      - name: B2 real P2 drum-dancer morale, Save v5 browser QA
        run: python qa/nl_classic_phase_b2_browser.py
      - name: Accelerated onboarding 30-minute battle and Save regression
        id: onboarding30
        run: python qa/nl_onboarding_30min.py --minutes 30
      - name: Accelerated onboarding 60-minute battle and Save regression
        if: ${{ success() || steps.onboarding30.outcome == 'failure' }}
        run: python qa/nl_onboarding_30min.py --minutes 60
      - name: Apply fixed-window UI V2 and capture 14 desktop + 14 mobile screens
        run: |
          python tools/build_nl_web_review.py --html index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.count('nl-fixed-window-style') == 1
          assert html.count('nl-fixed-window-review-script') == 1
          assert 'muu_dinh_tam_quoc_v1' in html
          PY
          python qa/nl_review_screenshots.py --html index.html --out qa/ui-v2-screenshots
      - name: D1-D4 visual asset coverage and painted map offline mobile smoke
        run: python qa/nl_art_d_browser.py
      - name: Phase A classic WEB resources, tax and named-recruitment browser QA
        run: python qa/nl_classic_phase_a_browser.py --html index.html
      - name: Phase B1 native Boss AI, 100-morale advisor and formation Chromium QA
        run: python qa/nl_classic_phase_b1_browser.py
      - name: Phase B3 25 troops, 24 formations, 221 hero skills on native P2 Chromium
        run: python qa/nl_classic_phase_b3_browser.py
      - name: Phase A2 31/7 city costs, silver mine and 207 named hero routes
        run: python qa/nl_classic_phase_a2_browser.py --html index.html
      - name: Upload review evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl-ui-v2-28-screens-and-qa
          path: |
            qa/ui-v2-screenshots/**
            qa/nl-art-d2/**
            qa/wiki-runtime-gap.json
            qa/NL_ONBOARDING_30MIN.json
            qa/NL_ONBOARDING_60MIN.json
            qa/web-review-sha.txt
            qa/web-review-html-sha256.txt
          if-no-files-found: warn
      - name: Prepare Pages website from QA-approved HTML
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import json,os
          from datetime import datetime,timezone
          result=json.loads(Path('qa/ui-v2-screenshots/results.json').read_text(encoding='utf-8'))
          assert result['status']=='PASS', 'Cannot publish unverified UI'
          Path('site/review-status.json').write_text(json.dumps({
            'status':'UI-REVIEW-CANDIDATE',
            'qa':'PASS',
            'sha':os.environ['GITHUB_SHA'],
            'source_branch':os.environ['GITHUB_REF_NAME'],
            'save_schema':'v5',
            'browser_screenshots':len(result['screens']),
            'note':'Playtest preview, not full release acceptance',
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload playable HTML as a separate downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nl-one-game-playable-html
          path: |
            site/index.html
            site/review-status.json
          if-no-files-found: error
      - name: Configure Pages deployment for the review site
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy permanent GitHub Pages URL after QA
    needs: build-and-review
    runs-on: ubuntu-24.04
    if: ${{ success() && github.ref == 'refs/heads/feature/nl-web-review-20261122' }}
    permissions:
      pages: write
      id-token: write
      contents: read
    # Isolate preview publishing from the default GitHub Pages branch protection.
    # The push trigger and job-level ref condition both restrict deployment to
    # feature/nl-web-review-20261122; never deploy on a pull request.
    environment:
      name: nl-web-review
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
