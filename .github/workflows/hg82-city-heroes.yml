name: HG82 City Heroes - Veteran Dismissal and Troop Dispatch
on:
  workflow_dispatch:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg10.js
      - hg408-hero-management.js
      - hg82-city-heroes.js
      - app.js
      - style-hg57.css
      - index.html
      - build_offline.py
      - qa-hg82-city-heroes.cjs
      - qa-hg82-city-heroes-chrome.py
      - .github/workflows/hg82-city-heroes.yml
permissions:
  contents: read
concurrency:
  group: hg82-hero-city-release
  cancel-in-progress: true
jobs:
  strict-city-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA, syntax and actual city ownership / veteran dismissal
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          for f in hg82-city-heroes.js hg10.js hg408-hero-management.js hg81-hero-progression.js app.js qa-hg82-city-heroes.cjs; do node --check "$f"; done
          node qa-hg82-city-heroes.cjs
          node qa-hg81-heroes.cjs
          node qa-hg408-heromanagement.cjs
          node qa-hg75-tactics.cjs
          node qa-engine.cjs
  offline-chromium:
    needs: strict-city-engine
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the only offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real multi-city hero retirement and troop dispatch UI
        run: python qa-hg82-city-heroes-chrome.py
      - name: Existing HG81 hero/EXP/talent UI regression
        run: python qa-hg81-heroes-chrome.py
      - name: Actual hero and gear UI regression
        run: python qa-hg408-hero-chrome.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HG82-City-Heroes-Dismissal-Dispatch-Chromium-QA
          if-no-files-found: ignore
          retention-days: 30
          path: |
            docs/qa/hg82/*.json
            docs/evidence/hg82/*.png
            docs/qa/hg81/*.json
            docs/evidence/hg81/*.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HEOOFGAIA-HG82-CITY-HEROES-ONE-OFFLINE-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
