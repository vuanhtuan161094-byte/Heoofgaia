name: HG73 Prestige Equipment and Ice-Crystal Combat VFX
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg73-gear-prestige.js
      - qa-hg73-gear.cjs
      - qa-hg73-visual-chrome.py
      - app.js
      - painter.js
      - style-hg57.css
      - index.html
      - build_offline.py
      - .github/workflows/hg73-gear-prestige.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prestige:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact-SHA engine, integrity and equipment regression
        run: |
          git rev-parse HEAD
          node --check hg73-gear-prestige.js
          node --check app.js
          node --check painter.js
          node --check qa-hg73-gear.cjs
          node qa-hg73-gear.cjs
          node qa-hg47-10slot.cjs
          node qa-hg71-special-hero.cjs
          node qa-hg70-reward-skills.cjs
      - name: Build only Play-Heoofgaia-HG11.html (41 real modules)
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Visual acceptance in true desktop and mobile-landscape Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg73-visual-chrome.py
      - name: Actual VFX screenshots and executable test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG73-Icy-Item-and-Combat-Visual-Evidence
          path: |
            docs/qa/hg73/*.json
            docs/evidence/hg73/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: One playable HTML with prestige items
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG73-Prestige-Gear-Single-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
