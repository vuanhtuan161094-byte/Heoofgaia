name: Group02 Wiki critical map and full-formation QA
on:
  push:
    branches: ['codex/nl-wiki-01-r02-20261117']
    paths:
      - '.github/workflows/ngoalong-group02-critical.yml'
      - 'data/ngoalong/group02_wiki/qa_critical.py'
permissions:
  contents: read
jobs:
  live_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify three representative Wiki dungeon types
        run: python data/ngoalong/group02_wiki/qa_critical.py
      - name: Preserve QA with defects and source URL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group02-wiki-three-map-qa
          path: group02-critical-qa.json
          if-no-files-found: warn
