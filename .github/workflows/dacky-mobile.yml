name: dacky-mobile-web-offline

on:
  push:
    branches:
      - feature/dacky-mobile-complete-20261124
    paths:
      - DackyMobile/**
      - .github/workflows/dacky-mobile.yml
  pull_request:
    branches:
      - feature/dacky-mobile-complete-20261124
    paths:
      - DackyMobile/**
      - .github/workflows/dacky-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dacky-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DackyMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run economy and campaign tests
        run: npm test
      - name: Build installable web and offline artifact
        run: npm run build
      - name: Upload Web/PWA and standalone offline build
        uses: actions/upload-artifact@v4
        with:
          name: dacky-mobile-web-${{ github.sha }}
          path: DackyMobile/dist/
          if-no-files-found: error
          retention-days: 14
