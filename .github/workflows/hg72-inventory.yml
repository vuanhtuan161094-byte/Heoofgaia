name: HG72 Inventory Search, Sorting and Touch UX
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths: [qa-hg72-inventory-chrome.py, .github/workflows/hg72-inventory.yml, app.js, style-hg57.css]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate source, 40 offline modules and original Save
        run: |
          git rev-parse HEAD
          node --check app.js
          node --check hg71-quest-heroes.js
          node qa-hg408-heromanagement.cjs
      - name: Assemble exactly one offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Desktop/mobile Chromium search, sort and Save
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg72-inventory-chrome.py
      - name: Visual and strict Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG72-Inventory-UX-Evidence
          path: |
            docs/qa/hg72/*.json
            docs/evidence/hg72/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: One playable offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG72-One-Inventory-Ready-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
