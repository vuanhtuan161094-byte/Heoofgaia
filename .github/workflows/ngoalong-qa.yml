name: NgoaLong P4 complete QA

on:
  push:
    branches: [main-ngoalong]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Exact SHA and source identity
        run: |
          git rev-parse HEAD | tee qa/commit-sha.txt
          sha256sum index.html | tee qa/index-sha256.txt
          test -s index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: P2 smoke Chromium
        run: python qa/smoke.py
      - name: P2 full 31 tests
        run: python qa/p2_full.py
      - name: P2 advanced 12 tests
        run: python qa/p2_advanced.py
      - name: P3 tactical 74 tests
        run: python qa/p3.py
      - name: P3 deterministic balance 360 scenarios
        run: python qa/p3_balance.py
      - name: P4 exact embedded art source 4 tests
        run: python qa/p4_assets.py
      - name: P4 original asset visual QA 14 tests
        run: python qa/p4_art.py
      - name: Upload exact SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngoalong-p4-qa-evidence
          path: |
            qa/*.json
            qa/*.png
            qa/commit-sha.txt
            qa/index-sha256.txt
          if-no-files-found: warn

      - name: Publish single playable HTML after full PASS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ngoalong-p4-playable
          path: |
            index.html
            qa/commit-sha.txt
            qa/index-sha256.txt
          if-no-files-found: error
