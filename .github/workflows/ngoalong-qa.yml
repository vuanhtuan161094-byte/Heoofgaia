name: Muu Dinh Tam Quoc · Ngọa Long-focused full regression and release

on:
  push:
    branches: [main-ngoalong, 'codex/**', 'feature/nl-codex-cloud-v1-finish', 'feature/nl-mcv2-08-items-integration', 'feature/nl-integration-review-20261119']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed_sources:
    name: Identify affected sources (no browser dependencies)
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.paths.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        name: Detect code, data, QA and asset changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(index\.html$|data/|tools/|qa/|assets/|\.github/workflows/)'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  quick:
    name: Focused gameplay, Save and data regression
    # Drop obsolete quick runs when newer code lands; never cancel full release.
    concurrency:
      group: ngoalong-focused-${{ github.ref }}
      cancel-in-progress: true
    needs: changed_sources
    if: needs.changed_sources.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build canonical single-file game and validate source pack
        run: |
          python tools/validate_ngoalong_data.py
          python tools/build_ngoa_long_mode.py
          python tools/build_ngoa_long_r03.py
          python tools/build_ngoa_long_r04.py
          python tools/build_ngoa_long_items_v1.py
          python tools/build_ngoa_long_items_v1.py --check
          python tools/build_ngoa_long_mode.py --check
          python tools/build_ngoa_long_r03.py --check
          python tools/build_ngoa_long_r04.py --check
          git rev-parse HEAD | tee qa/commit-sha.txt
          sha256sum index.html | tee qa/index-sha256.txt
      - name: Hero207, Chat01 and Chat05 focused Node contracts
        run: |
          node qa/nl_heroes207_runtime_v1.test.cjs
          node --test qa/modules/combat/*.test.cjs
          node --test qa/nl_tactical_intel_view.test.cjs
          node --test qa/nl_native_pve_a1.test.cjs
          node --test qa/modules/heroes/*.test.cjs qa/nl_hero_catalogue.test.cjs qa/nl_hero_development.test.cjs
      - name: Chat02 Troops, Chat03 City and Chat06 Campaign source contract QA
        run: |
          node --test qa/modules/troops/*.test.cjs
          node --test qa/modules/city/*.test.cjs qa/nl_city_*.test.cjs
          node --test qa/modules/campaign/*.test.cjs qa/nl_campaign_*.test.cjs
      - name: Install minimal browser QA dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Data, tactical combat, progression and Save/legacy safety gates
        run: |
          python qa/nl_data.py
          python qa/nl_wiki_troop_facts.py
          python qa/nl_content_contract_v1.py
          python tools/nl_content_contract_v1.py --out qa/nl_content_index_v1.json
          python qa/nl_content_contract_v1.py
          python tools/nl_content_contract_v1.py --out qa/nl_content_index_v1.json
          python qa/ngoa_long_mode.py
          python qa/nl_heroes207_browser.py
          python qa/nl_premerge_hero207_items.py
          python qa/nl_city_integration.py
          python qa/nl_native_pve_a1_browser.py
          python qa/nl_r02.py
          python qa/nl_r03.py
          python qa/nl_progression.py
          node --test qa/nl_item_inventory_group08.test.cjs qa/nl_item_equipment_ui_group08.test.cjs qa/nl_item_balance_v3.test.cjs qa/nl_item_economy_b2.test.cjs
          python qa/nl_item_integration.py
          python qa/cl_p1_p2.py
          python qa/cl_p6.py
          python qa/p2_full.py
          python qa/p2_advanced.py
      - name: Upload focused exact-SHA QA evidence (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muu-dinh-tam-quoc-focused-evidence
          path: |
            qa/*.json
            qa/commit-sha.txt
            qa/index-sha256.txt
          if-no-files-found: warn

      - name: Upload combined Heroes207 and Items HTML candidate after focused PASS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muu-dinh-tam-quoc-premerge-playable-candidate
          path: |
            index.html
            qa/commit-sha.txt
            qa/index-sha256.txt
          if-no-files-found: error

  game:
    # Full historical CL/asset/video regression remains available on every
    # main-ngoalong push and on explicit task-branch commits tagged [full-ci].
    # Docs-only or focused feature commits must not republish a fake release.
    if: github.ref == 'refs/heads/main-ngoalong' || contains(github.event.head_commit.message, '[full-ci]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wiki provenance data and compile canonical R02/R03/R04 Alpha HTML
        run: |
          python tools/validate_ngoalong_data.py
          python tools/build_ngoa_long_mode.py
          python tools/build_ngoa_long_r03.py
          python tools/build_ngoa_long_r04.py
          python tools/build_ngoa_long_items_v1.py
          python tools/build_ngoa_long_items_v1.py --check
          python tools/build_ngoa_long_mode.py --check
          python tools/build_ngoa_long_r03.py --check
          python tools/build_ngoa_long_r04.py --check
      - name: Exact SHA and source identity
        run: |
          git rev-parse HEAD | tee qa/commit-sha.txt
          sha256sum index.html | tee qa/index-sha256.txt
          test -s index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.58.0 pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: NL-P1 schema, provenance, references and progression validator gate
        run: |
          python qa/nl_data.py
          python qa/nl_wiki_troop_facts.py
      - name: Hero207, Chat01 and Chat05 source/runtime Node QA
        run: |
          node qa/nl_heroes207_runtime_v1.test.cjs
          node --test qa/modules/combat/*.test.cjs
          node --test qa/nl_tactical_intel_view.test.cjs
          node --test qa/nl_native_pve_a1.test.cjs
          node --test qa/modules/heroes/*.test.cjs qa/nl_hero_catalogue.test.cjs qa/nl_hero_development.test.cjs
      - name: Chat02 Troops, Chat03 City and Chat06 Campaign source contract QA
        run: |
          node --test qa/modules/troops/*.test.cjs
          node --test qa/modules/city/*.test.cjs qa/nl_city_*.test.cjs
          node --test qa/modules/campaign/*.test.cjs qa/nl_campaign_*.test.cjs
      - name: Hero207 real-browser recruiting and Save-v5 QA
        run: python qa/nl_heroes207_browser.py
      - name: Combined Hero207 + Items browser/save/replay gate
        run: python qa/nl_premerge_hero207_items.py
      - name: CHAT03 City real browser, shared Save and mobile integration
        run: python qa/nl_city_integration.py
      - name: A1 28-stage native Combat V2, Boss AI, troop, replay and receipt browser gate
        run: python qa/nl_native_pve_a1_browser.py
      - name: P2 smoke Chromium
        run: python qa/smoke.py
      - name: Ngọa Long 3x3 command center desktop/mobile browser gate
        run: python qa/ngoa_long_mode.py
      - name: NL-R02 same-seed combat, morale, AI and save migration Chromium gate
        run: python qa/nl_r02.py
      - name: NL-R03 data-driven evolutions and tactical encounters Chromium gate
        run: python qa/nl_r03.py
      - name: NL-R03 hero training, equipment and research progression gate
        run: python qa/nl_progression.py
      - name: NL-V2 Item inventory, seven slots, Save v5, real battle bonus and unique rewards
        run: |
          node --test qa/nl_item_inventory_group08.test.cjs qa/nl_item_equipment_ui_group08.test.cjs qa/nl_item_balance_v3.test.cjs qa/nl_item_economy_b2.test.cjs
          python qa/nl_item_integration.py
      - name: NL-R04 reproduce event-gated scout pose and run Chromium art gate
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -c "from PIL import __version__; assert __version__ == '11.3.0'"
          python tools/register_nl_r04_attack.py --check
          python tools/build_ngoa_long_r04.py --check
          python qa/nl_r04_pilot.py
          python -m pip install --disable-pip-version-check pillow==12.3.0
          python -c "from PIL import __version__; assert __version__ == '12.3.0'"
      - name: NL 30-minute simulated onboarding, affordability and loss recovery gate
        run: python qa/nl_onboarding_30min.py
      - name: NL 60-minute continuous first-ten-stage campaign progression gate
        run: python qa/nl_onboarding_30min.py --minutes 60
      - name: CL-P1/P2 real battle and campaign loop
        run: python qa/cl_p1_p2.py
      - name: CL-P3 territory economy and 30-minute strategy loop
        run: python qa/cl_p3_economy.py
      - name: CL-P4 playable roster, faction synergies, boss campaign and settlement
        run: python qa/cl_p4.py
      - name: CL-P4 deterministic balance sweep across 360 campaign battles
        run: python qa/cl_p4_balance.py
      - name: CL-P5 regenerate scenic map and verify source-to-HTML bytes
        run: |
          cp assets/p5/cl-p5-region-map.webp /tmp/cl-p5-region-map.webp
          python tools/build_cl_p5_map.py
          cmp /tmp/cl-p5-region-map.webp assets/p5/cl-p5-region-map.webp
          python qa/p5_assets.py
      - name: CL-P5 desktop and mobile territory visual QA
        run: python qa/cl_p5_visual.py
      - name: CL-P5 original infantry atlas rebuild and Chromium action gate
        run: |
          # The signed source atlas was exported with Pillow 11.3.0.
          # Pillow 12.3.0 recompresses lossless WebP to different bytes.
          # Reproduce using the source toolchain; never bypass exact-byte cmp.
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -c "from PIL import __version__; assert __version__ == '11.3.0'"
          cp assets/p5/cl-p5-infantry-scout-v1/cl-p5-infantry-scout-atlas.webp /tmp/cl-p5-infantry-scout-atlas.webp
          python tools/build_p5_infantry_scout.py --embed
          cmp /tmp/cl-p5-infantry-scout-atlas.webp assets/p5/cl-p5-infantry-scout-v1/cl-p5-infantry-scout-atlas.webp
          python qa/cl_p5_infantry.py
          python tools/build_p5_infantry_scout.py --embed --asset-qc-pass
          cmp /tmp/cl-p5-infantry-scout-atlas.webp assets/p5/cl-p5-infantry-scout-v1/cl-p5-infantry-scout-atlas.webp
      - name: Restore baseline Pillow for remaining P4.1 asset regressions
        run: |
          python -m pip install --disable-pip-version-check pillow==12.3.0
          python -c "from PIL import __version__; assert __version__ == '12.3.0'"
      - name: CL-P6 diplomacy, weather, concurrent armies, siege and endgame
        run: python qa/cl_p6.py
      - name: P2 full 31 tests
        run: python qa/p2_full.py
      - name: P2 advanced 12 tests
        run: python qa/p2_advanced.py
      - name: P3 tactical 74 tests
        run: python qa/p3.py
      - name: P3 deterministic balance 360 scenarios
        run: python qa/p3_balance.py
      - name: P4 original assets and CL-P4 roster exact-source gate
        run: python qa/p4_assets.py
      - name: P4 original asset visual QA 14 tests
        run: python qa/p4_art.py
      - name: P4.1 reproduce 288 frames and exact atlas bytes
        run: |
          cp assets/p41/troops_p41.webp /tmp/ngoalong-p41-source.webp
          python tools/build_p41_atlas.py
          cmp /tmp/ngoalong-p41-source.webp assets/p41/troops_p41.webp
          python -c "import json,pathlib;d=json.loads(pathlib.Path('assets/p41/troops_manifest.json').read_text());assert d['frameCount']==288"
      - name: P4.1 Chromium animation and event QA 18 checks
        run: python qa/p41_animation.py
      - name: P4.1 install FFmpeg video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: P4.1 generate actual Chromium render video
        run: |
          command -v ffmpeg
          python qa/p41_video.py
      - name: P4.1 package 288 real PNG frames
        run: |
          cd assets/p41
          zip -q -r ../../qa/p41-288-frames-source.zip frames
      - name: Upload exact SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muu-dinh-tam-quoc-ngoa-long-alpha-evidence
          path: |
            qa/*.json
            qa/*.png
            qa/*.webm
            qa/p41-*.mp4
            qa/p41-288-frames-source.zip
            assets/p41/troops_manifest.json
            assets/r04/*raw-master.png
            assets/r04/*master.png
            assets/r04/*.json
            assets/r04/*.md
            assets/p5/cl-p5-region-map-manifest.json
            assets/p5/cl-p5-infantry-scout-v1/cl-p5-infantry-scout-atlas.webp
            assets/p5/cl-p5-infantry-scout-v1/cl-p5-infantry-scout-manifest.json
            qa/commit-sha.txt
            qa/index-sha256.txt
            data/ngoalong/alpha_content.json
          if-no-files-found: warn

      - name: Publish single playable HTML after full PASS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muu-dinh-tam-quoc-ngoa-long-alpha-playable
          path: |
            index.html
            qa/commit-sha.txt
            qa/index-sha256.txt
          if-no-files-found: error
