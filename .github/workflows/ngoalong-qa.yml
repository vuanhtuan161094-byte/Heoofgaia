name: NgoaLong P2 browser QA

on:
  push:
    branches: [main-ngoalong]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source proof
        run: |
          sha256sum index.html
          test -s index.html
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke actual game
        run: python qa/smoke.py
      - name: Evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngoalong-p2-browser-evidence
          path: |
            qa/smoke-result.json
            qa/smoke-1280x720.png
          if-no-files-found: warn
