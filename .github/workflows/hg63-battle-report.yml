name: HG63 Battle Report and Item Visual QA
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths: [app.js, painter.js, style-hg57.css, qa-hg63-chrome.py, .github/workflows/hg63-battle-report.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-real-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SHA and regression engine
        run: |
          git rev-parse HEAD
          node --check app.js
          node --check painter.js
          node qa-hg61-enemies.cjs
          node qa-hg58-combat.cjs
      - name: Assemble one offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Chromium PC and landscape phone
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg63-chrome.py
      - name: Evidence from Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG63-Battle-Report-Evidence
          path: |
            docs/qa/hg63/*.json
            docs/evidence/hg63/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Single tested offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG63-Single-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
