name: HG55 lossless offline pack + mobile benchmark / FULL regression
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg47-ten-slot.js'
      - 'hg46-equipment.js'
      - 'hg18.js'
      - 'hg29-loot.js'
      - 'hg31-legendary-gear.js'
      - 'app.js'
      - 'index.html'
      - 'style-hg03.css'
      - 'style-hg48.css'
      - 'style-hg49.css'
      - 'painter.js'
      - 'build_offline.py'
      - 'qa-hg47-10slot.cjs'
      - 'qa-hg47-ui-chrome.py'
      - 'qa-hg46-equipment-chrome.py'
      - 'qa-hg31-ui-chrome.py'
      - 'qa-hg409-pve-chrome.py'
      - 'qa-hg408-hero-chrome.py'
      - 'qa-hg48-mobile-chrome.py'
      - 'qa-hg49-spectrum-chrome.py'
      - 'qa-hg55-performance-chrome.py'
      - 'tools/hg55_embed_optimizer.py'
      - '.github/workflows/hg49-spectrum.yml'
      - '.github/workflows/hg55-performance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hg55-feature-branch
  cancel-in-progress: true
jobs:
  optimized-release-and-five-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ten-slot, four-race, real loot, Boss-Tower and Save v07 engine
        id: engine
        run: |
          node --check hg47-ten-slot.js
          node --check app.js
          node --check painter.js
          node --check qa-hg47-10slot.cjs
          echo "HG47 exact SHA: $(git rev-parse HEAD)"
          node qa-hg47-10slot.cjs
          node qa-hg46-equipment.cjs
          node qa-hg46b-balance.cjs
          node qa-hg29-loot.cjs
          node qa-hg31-legendary.cjs
          node qa-hg18-core.cjs
          node qa-hg40-tactical.cjs
      - name: Build one canonical standalone HTML
        id: build
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          python -c 'import json; x=json.load(open("docs/qa/hg55/build-image-pack.json")); assert x["verified_image_count"]==22 and x["all_visible_pixels_identical"] and x["saved_html_bytes"]>=1000000; print("HG55 lossless pack verified",x["saved_html_bytes"])'
          sha256sum Play-Heoofgaia-HG11.html
          node qa-engine.cjs
      - name: Chromium 5 phone/desktop viewports and v07 cold Save
        id: chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile tools/hg55_embed_optimizer.py qa-hg55-performance-chrome.py qa-hg47-ui-chrome.py qa-hg46-equipment-chrome.py qa-hg408-hero-chrome.py qa-hg29-ui-chrome.py qa-hg31-ui-chrome.py qa-hg48-mobile-chrome.py qa-hg49-spectrum-chrome.py
          python qa-hg47-ui-chrome.py
          python qa-hg46-equipment-chrome.py
          python qa-hg408-hero-chrome.py
          python qa-hg29-ui-chrome.py
          python qa-hg31-ui-chrome.py
          python qa-hg48-mobile-chrome.py
          python qa-hg49-spectrum-chrome.py
          python qa-hg55-performance-chrome.py
      - name: Evidence for every pass/fail, no generated victory receipts
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG55-Spectrum-FULL-CI-Evidence
          path: |
            docs/qa/hg55/*.json
            docs/qa/hg49/*.json
            docs/evidence/hg55/*.png
            docs/evidence/hg49/*.png
            docs/qa/hg48/*.json
            docs/evidence/hg48/*.png
            docs/qa/hg47/*.json
            docs/evidence/hg47/*.png
            docs/qa/hg46/*.json
            docs/evidence/hg46/*.png
            docs/qa/hg408/*.json
            docs/evidence/hg408/*.png
            docs/qa/hg29/*.json
            docs/evidence/hg29/*.png
            docs/qa/hg31/*.json
            docs/evidence/hg31/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: ONE final HTML playable offline
        id: offline_html
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG55-Playable-Single-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
      - name: Publish exact-SHA CI outcome to the SAME branch (for connector-visible evidence)
        if: always()
        env:
          HG55_CI_REPORT_TOKEN: ${{ github.token }}
          HG55_STEP_ENGINE: ${{ steps.engine.outcome }}
          HG55_STEP_BUILD: ${{ steps.build.outcome }}
          HG55_STEP_CHROMIUM: ${{ steps.chromium.outcome }}
          HG55_STEP_EVIDENCE: ${{ steps.evidence.outcome }}
          HG55_STEP_OFFLINE_HTML: ${{ steps.offline_html.outcome }}
        run: |
          python - <<'PY'
          import os, sys, json, base64, hashlib, datetime, urllib.request, urllib.error, urllib.parse
          repo=os.environ["GITHUB_REPOSITORY"]
          branch="feature/hog1-research-to-playable-20261102"
          source=os.environ["GITHUB_SHA"]
          run_id=os.environ["GITHUB_RUN_ID"]
          attempt=os.environ.get("GITHUB_RUN_ATTEMPT","1")
          steps={key:os.environ.get("HG55_STEP_"+key.upper(),"unknown") for key in ("engine","build","chromium","evidence","offline_html")}
          p="Play-Heoofgaia-HG11.html"
          artifact={"file":p,"exists":os.path.isfile(p)}
          if artifact["exists"]:
              with open(p,"rb") as f:
                  h=hashlib.sha256()
                  while True:
                      block=f.read(1024*1024)
                      if not block:break
                      h.update(block)
                  artifact.update(size_bytes=f.tell(),sha256=h.hexdigest())
          result={"gate":"HG55 global spectrum UI/UX VFX exact-SHA","source_sha":source,"workflow_run_id":int(run_id),
           "workflow_url":"https://github.com/"+repo+"/actions/runs/"+run_id,
           "run_attempt":int(attempt),"branch":branch,"steps":steps,
           "engine_pass":steps["engine"]=="success","build_pass":steps["build"]=="success",
           "chromium_pass":steps["chromium"]=="success","single_html_uploaded":steps["offline_html"]=="success",
           "artifact":artifact,"timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
           "status":"PASS" if all(steps[k]=="success" for k in ("engine","build","chromium","offline_html")) else "FAIL_OR_INCOMPLETE"}
          name="actions-"+source+".json"
          target="docs/qa/hg55/"+name
          api="https://api.github.com/repos/"+repo+"/contents/"+target
          token=os.environ["HG55_CI_REPORT_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
           "X-GitHub-Api-Version":"2022-11-28","User-Agent":"HG55-CI-exact-SHA-reporter"}
          sha=None
          get=urllib.request.Request(api+"?ref="+urllib.parse.quote(branch,safe=""),headers=headers)
          try:
              with urllib.request.urlopen(get,timeout=25) as resp:
                  sha=json.load(resp).get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code!=404:raise
          payload={"message":"ci(hg55): record exact-SHA run "+source[:12]+" [skip ci]",
           "branch":branch,"content":base64.b64encode((json.dumps(result,indent=2,ensure_ascii=False)+"\n").encode("utf-8")).decode("ascii")}
          if sha:payload["sha"]=sha
          put=urllib.request.Request(api,data=json.dumps(payload).encode("utf-8"),headers={**headers,"Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(put,timeout=40) as resp:
              created=json.load(resp)
          print("HG55_CI_REPORT",target,"source",source,"status",result["status"],"receipt",created.get("commit",{}).get("sha",""))
          PY
