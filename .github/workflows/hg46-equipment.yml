name: HG46 real gear ownership, combat sets, v07 and 5-screen Chromium
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg46-equipment.js'
      - 'hg408-hero-management.js'
      - 'app.js'
      - 'style-hg03.css'
      - 'index.html'
      - 'build_offline.py'
      - 'qa-hg46-equipment.cjs'
      - 'qa-hg46-equipment-chrome.py'
      - '.github/workflows/hg46-equipment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HG46 owned gear, set power, paid enhancement and strict Save v07
        run: |
          node --check hg46-equipment.js
          node --check app.js
          node --check qa-hg46-equipment.cjs
          node qa-hg46-equipment.cjs
      - name: Rebuild ONLY the existing offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Real desktop + phone Chromium gear UI, actions and Save/Reload
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg46-equipment-chrome.py
          python qa-hg46-equipment-chrome.py
      - name: Upload engine and visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG46-Real-Equipment-Test-Evidence
          path: |
            docs/qa/hg46/*.json
            docs/evidence/hg46/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Deliver same one HTML on full focused QA success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG46-Playable-Standalone-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
