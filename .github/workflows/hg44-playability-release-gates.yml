name: HG44 G playability, UX, PvE, VFX and one-file release candidate
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'app.js'
      - 'hg42-boss-screen.js'
      - 'hg43-troop-profiles.js'
      - 'hg40-tactical.js'
      - 'painter.js'
      - 'style-hg03.css'
      - 'index.html'
      - 'build_offline.py'
      - 'qa-hg40-real-skill-chrome.py'
      - 'qa-hg34-combat-smooth-chrome.py'
      - 'qa-hg403-visual-gate-chrome.py'
      - 'qa-hg44-journey-chrome.py'
      - '.github/workflows/hg44-playability-release-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source, canonical 40 traits, organic economy and no-phantom-reward regression
        run: |
          node --check app.js
          node --check hg40-tactical.js
          node --check hg42-boss-screen.js
          node --check hg43-troop-profiles.js
          node --check qa-hg42-boss-screens.cjs
          node qa-hg40-tactical.cjs
          node qa-hg43-troop-profiles.cjs
          node qa-hg42-boss-screens.cjs
          node qa-hg32-organic-full.cjs
          node qa-hg28-animation-coverage.cjs --require-full
          node qa-engine.cjs
      - name: Build existing ONE offline HTML without Save changes
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -f Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Four real Chromium viewports, live Priest, 40 skill VFX, 16-stack Boss and Save v07
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg34-combat-smooth-chrome.py qa-hg40-real-skill-chrome.py qa-hg403-visual-gate-chrome.py qa-hg44-journey-chrome.py
          python qa-hg44-journey-chrome.py
          python qa-hg43-troop-chrome.py
          python qa-hg42-boss-chrome.py
          python qa-hg40-real-skill-chrome.py
          python qa-hg403-visual-gate-chrome.py
          python qa-hg34-combat-smooth-chrome.py
      - name: Store all actual Chromium screenshots, checks and effect receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG44-G-Real-Playability-Visual-QA
          path: |
            docs/qa/hg44/*.json
            docs/qa/hg34/combat-smoothness.json
            docs/evidence/hg34/*.png
            docs/evidence/hg44/*.png
            docs/qa/hg40/chromium-real-skill.json
            docs/evidence/hg40/hg403-npc-priest-shield-real-canvas.png
            docs/qa/hg403/chromium-40-visual-gate.json
            docs/evidence/hg403/visual-gate/*.png
            docs/qa/hg43/*.json
            docs/qa/hg42/*.json
            docs/evidence/hg43/*.png
            docs/evidence/hg42/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: "HG44 G candidate: exactly ONE playable offline HTML for PC and phone"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG44-G-Candidate-One-Playable-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
