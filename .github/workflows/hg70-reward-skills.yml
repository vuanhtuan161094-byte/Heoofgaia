name: HG70 Exclusive Reward Skills and Offline Integrity
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths: [hg40-tactical.js, hg71-quest-heroes.js, build_offline.py, qa-hg70-reward-skills.cjs, qa-hg71-special-hero.cjs, .github/workflows/hg70-reward-skills.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reward-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SHA and eight special-unit combat receipts
        run: |
          git rev-parse HEAD
          node --check hg40-tactical.js
          node --check qa-hg70-reward-skills.cjs
          node qa-hg70-reward-skills.cjs
          node qa-hg40-tactical.cjs
          node qa-hg403-presentation.cjs
          node qa-hg407-combat-presentation.cjs
          node qa-hg47-10slot.cjs
          node qa-hg71-special-hero.cjs
      - name: Build single offline HTML, no second copy
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Downloadable single offline game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG70-Exclusive-Skills-Playable-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
