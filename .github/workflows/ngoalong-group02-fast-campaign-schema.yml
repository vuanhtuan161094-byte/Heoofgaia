name: Group02 fast inspect public per-map source JSON
on:
  push:
    branches: ['codex/nl-wiki-01-r02-20261117']
    paths: ['.github/workflows/ngoalong-group02-fast-campaign-schema.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read structural metadata only from public campaign files
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          root='https://cdn-mainsite-aka.vnggames.com/products/mwly/landing/2026-ngoa-long-wiki-clone/data/campaign'
          def typ(v,depth=0):
            if isinstance(v,dict):
              return {'type':'object','size':len(v),'keys':list(v)[:48],
                'samples':{k:typ(x,depth+1) for k,x in list(v.items())[:5]}} if depth<3 else {'type':'object','keys':list(v)[:38],'size':len(v)}
            if isinstance(v,list):
              return {'type':'array','size':len(v),'first':typ(v[0],depth+1) if v and depth<3 else None}
            return type(v).__name__
          result=[]
          for mid in (1,3,269,317):
            url=f'{root}/{mid}.json'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as res:
                raw=res.read(20000000)
                data=json.loads(raw)
              details={key:typ(data.get(key),0) for key in ('vn','cn','strategies','hard','side')}
              first=(data.get('vn',{}).get('npcs') or [{}])[0]
              detailNpc={k:typ(first.get(k),0) for k in ('ident','name','type','troops','merit','power','fastAttack','effects','formation','souls','drops')}
              sampleUnits=[{'pos':u.get('pos'),'general':u.get('general'),'soldierId':u.get('soldierId'),
                'hp':u.get('hp'),'level':u.get('level'),
                'activeSkillType':type(u.get('activeSkill')).__name__,
                'activeSkillShape':typ(u.get('activeSkill'),0),
                'effectsShape':typ(u.get('effects'),0)}
                for u in first.get('formation',[])[:3]]
              values={'npcRawTroops':first.get('troops'),
                'summedRawUnitHP':sum(x.get('hp',0) for x in first.get('formation',[]) if isinstance(x.get('hp'),(int,float))),
                'unitCount':len(first.get('formation',[])),
                'activeSkills':[{'name':v.get('activeSkill',{}).get('name'),'level':v.get('activeSkill',{}).get('level')}
                  for v in first.get('formation',[])[:5]]}
              result.append({'map':mid,'bytes':len(raw),'shape':typ(data),'detailFields':details,
                'npcDetailShapes':detailNpc,'sampleUnitFacts':sampleUnits,'exactTotalsAndSkills':values})
            except Exception as ex:
              result.append({'map':mid,'error':repr(ex)[:260]})
          Path('campaign-schema-inspection.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print("SOURCE_SCHEMA",json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group02-fast-campaign-schema
          path: campaign-schema-inspection.json
          if-no-files-found: warn
