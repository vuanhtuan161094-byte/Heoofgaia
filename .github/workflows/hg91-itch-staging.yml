name: HG91 itch.io Staging - 6 Locale UI and One HTML
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg56-ui.js'
      - 'index.html'
      - 'style-hg57.css'
      - 'build_offline.py'
      - 'qa-hg91-itch-chrome.py'
      - 'tools/hg91_itch_pack.py'
      - '.github/workflows/hg91-itch-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg91-itch-staging
  cancel-in-progress: true
jobs:
  browser-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SHA and locale syntax
        run: |
          git rev-parse HEAD
          node --check hg56-ui.js
          node --check app.js
      - name: Build same one canonical offline game
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
      - name: Real hosted Chromium localization, Save and mobile viewport
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg91-itch-chrome.py
      - name: Package one HTML5 entry point inside a verified ZIP
        run: python tools/hg91_itch_pack.py
      - name: Make store cover and screenshots from authentic Chromium captures
        run: python tools/hg91_promo.py
      - name: Stage authentic itch.io store imagery
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HG91-itch-store-cover-screenshots
          path: dist/itch/store-media/
          retention-days: 30
      - name: Stage itch.io HTML5 ZIP, DO NOT publish
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HG91-itch-html5-zip-staging
          path: |
            dist/itch/hg91-itch-html5.zip
            dist/itch/hg91-stage-manifest.json
          retention-days: 30
      - name: Preserve real Chromium evidence, including failure cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HG91-itch-browser-evidence
          path: |
            docs/qa/hg91/itch-chromium.json
            docs/qa/hg91/*.png
          if-no-files-found: ignore
          retention-days: 30
