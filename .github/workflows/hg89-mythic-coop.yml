name: HG89 Mythic Pantheon Fragments and 3-Hero NPC Raid - ONE HTML
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg89-mythic-heroes.js
      - hg261-joint-boss.js
      - hg26-boss-autohunt.js
      - hg88-tower-hero-cards.js
      - hg18.js
      - index.html
      - build_offline.py
      - app.js
      - style-hg57.css
      - qa-hg89-pantheon-joint.cjs
      - qa-hg89-ui-chrome.py
      - qa-hg88-ui-chrome.py
      - .github/workflows/hg89-mythic-coop.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg89-pantheon-one-game
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact SHA and canonical gameplay modules
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check app.js
          node --check hg89-mythic-heroes.js
          node --check hg88-tower-hero-cards.js
          node --check hg261-joint-boss.js
          node --check hg26-boss-autohunt.js
          node qa-hg89-pantheon-joint.cjs
          node qa-hg261-joint.cjs
          node qa-hg88-tower-hero-cards.cjs
          node qa-hg87-equipment.cjs
          node qa-hg82-city-heroes.cjs
          node qa-hg84-loot-balance.cjs
          node qa-engine.cjs
  chromium:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build ONE standalone playable offline HTML
        run: |
          set -euxo pipefail
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Actual desktop and mobile Chromium tests on six mythic heroes and co-op raid
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg89-ui-chrome.py
          python qa-hg88-ui-chrome.py
          python qa-hg87-ui-chrome.py
          python qa-hg86-rendered-art-chrome.py
      - name: Save screenshots and QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HG89-Mythic-Pantheon-Coop-Real-QA
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/evidence/hg89/*.png
            docs/qa/hg89/*.json
            docs/evidence/hg88/*.png
            docs/qa/hg88/*.json
      - name: Deliver exactly one final HTML
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HG89-Heroes-of-Gaia-ONE-HTML
          retention-days: 30
          if-no-files-found: error
          path: Play-Heoofgaia-HG11.html
