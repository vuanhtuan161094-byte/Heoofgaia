name: Group02 factual dungeon research from VNG Wiki
on:
  push:
    branches: ['codex/nl-wiki-01-r02-20261117']
    paths:
      - 'data/ngoalong/group02_wiki/crawl_dungeons.py'
      - '.github/workflows/ngoalong-group02-crawl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile data/ngoalong/group02_wiki/crawl_dungeons.py
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Read public Wiki map and NPC pages
        run: python data/ngoalong/group02_wiki/crawl_dungeons.py --shard ${{ matrix.shard }} --shards 8 --delay .8 --output out/part-${{ matrix.shard }}.json
      - name: Store structured evidence for each shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group02-wiki-part-${{ matrix.shard }}
          path: out/*.json
          retention-days: 30
          if-no-files-found: warn
