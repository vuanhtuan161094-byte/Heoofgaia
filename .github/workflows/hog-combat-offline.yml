name: Heoofgaia offline combat QA
on:
  push:
    branches:
      - feature/hog1-research-to-playable-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for reproducible Human Archer sprite atlas
        run: python -m pip install Pillow==11.3.0
      - name: Build current offline HTML reproducibly
        run: |
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-first.sha
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-second.sha
          diff -u /tmp/heoofgaia-first.sha /tmp/heoofgaia-second.sha
      - name: QA source-registered 48-frame Human Archer PNG atlas
        run: python qa-hg143-archer-art.py
      - name: Check gameplay and battle viewport
        run: |
          node --check app.js
          node --check painter.js
          node --check engine.js
          node qa-engine.cjs
          node qa-hg09-combat-viewport.cjs
      - name: HG16 G4 core combat and production stress gate
        run: |
          node --check qa-hg16-g4-stress.cjs
          node qa-hg16-g4-stress.cjs
      - name: HG17 unseeded New Game to second castle gate
        run: |
          node --check qa-hg17-organic-newgame.cjs
          node qa-hg17-organic-newgame.cjs
      - name: HG18 equipment and quest economy progression gate
        run: |
          node --check hg18.js
          node --check qa-hg18-core.cjs
          node qa-hg18-core.cjs
      - name: HG18.2 elite logistics, NPC XP and scouting AP balance
        run: |
          node --check hg182.js
          node --check qa-hg182-balance.cjs
          node qa-hg182-balance.cjs
      - name: HG20 private PvE tower and hero army Save gate
        run: |
          node --check hg20-private.js
          node --check qa-hg20-private.cjs
          node qa-hg20-private.cjs
      - name: HG26 opt-in Boss hunts, real combat/AP/losses and recovery
        run: |
          node --check hg26-boss-autohunt.js
          node --check qa-hg26-boss.cjs
          node qa-hg26-boss.cjs
      - name: HG24 safe hero templates, paid logistics, private EXP and Boss dispatch
        run: |
          node --check hg24-private-automation.js
          node --check qa-hg24-private.cjs
          node qa-hg24-private.cjs
      - name: HG21 owner-bound 3x2 tactical tower acceptance
        run: |
          node --check hg21-tower-tactical.js
          node --check qa-hg21-tactical.cjs
          node qa-hg21-tactical.cjs
      - name: HG19 vector art coverage and icon regression
        run: |
          node --check art-pack.js
          node --check qa-hg19-art.cjs
          node qa-hg19-art.cjs
      - name: HG19.1 free-source sprites and icon license regression
        run: |
          node --check art-free-sprites.js
          node --check art-free-icons-core.js
          node --check art-free-icons-extra.js
          node --check qa-hg191-assets.cjs
          node qa-hg191-assets.cjs
      - name: HG19.2 24 species-matched CC0 source sprite integrity
        run: |
          node --check art-hg192-sprites.js
          node --check qa-hg192-assets.cjs
          node qa-hg192-assets.cjs
      - name: HG19.3 final seven troop PNGs and 40/40 art inventory
        run: |
          node --check art-hg193-sprites.js
          node --check qa-hg193-assets.cjs
          node qa-hg193-assets.cjs
      - name: HG22.1 five-action authentic Skeleton source integrity
        run: |
          node --check art-hg22-skeleton.js
          node --check qa-hg22-skeleton.cjs
          node qa-hg22-skeleton.cjs
      - name: Install headless Chromium for actual battlefield acceptance
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: HG19 Chromium SVG decode and visual contact sheet
        run: python qa-hg19-art-chrome.py
      - name: HG19.1 real PNG sprite frames and Game-Icons Chrome acceptance
        run: python qa-hg191-assets-chrome.py
      - name: HG19.2 Chromium source sprite decode and battle readability
        run: python qa-hg192-assets-chrome.py
      - name: HG19.3 seven PNGs, 35 combat renders and 40-unit Chromium check
        run: python qa-hg193-assets-chrome.py
      - name: HG22.1 real Chrome five-action Skeleton and offline art proof
        run: python qa-hg22-skeleton-chrome.py
      - name: Chrome battlefield viewport, pointer and Save/Reload acceptance
        run: python qa-hg09-combat-viewport-chrome.py
      - name: HG18 actual quest forging rebirth UI Chrome gate
        run: python qa-hg18-ui-chrome.py
      - name: HG18.1 fixed viewport and popup UX acceptance (1280x720 plus landscape)
        run: python qa-hg181-window-chrome.py
      - name: HG18.1 organic high-tier unlock Boss and rebirth contract
        run: |
          node --check qa-hg181-organic-endgame.cjs
          node qa-hg181-organic-endgame.cjs
      - name: HG17 first-launch organic build research recruit and mine Chromium
        run: python qa-hg17-organic-newgame-chrome.py
      - name: HG10 offline world AI castle interaction and Save Reload in Chromium
        run: python qa-hg10-world-ai-chrome.py
      - name: Verify Fandom Hero Tasks in offline Chromium
        run: python qa-hg12-hero-tasks-chrome.py
      - name: Chrome four-faction troop sprite motion and combat Save/Load
        run: python qa-hg14-sprite-chrome.py
      - name: Chromium Human Archer six animations, real battle and Save/Load
        run: python qa-hg143-archer-chrome.py
      - name: HG14.5 real Chromium grid and HP toggles, receipt FX, mobile and Save
        run: python qa-hg145-combat-chrome.py
      - name: Record build SHA and size
        run: |
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html | tee Build-SHA256.txt
          wc -c Play-Heoofgaia-HG11.html
      - name: Upload offline playable HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Play-Heoofgaia-HG11
          path: |
            Play-Heoofgaia-HG11.html
            Build-SHA256.txt
            docs/evidence/hg09/fullscreen-combat-*.png
            docs/qa/hg09/fullscreen-combat-chrome.json
            docs/evidence/hg10/ai-city-map-chrome.png
            docs/qa/hg10/world-ai-chrome.json
            docs/qa/hg16/g4-stress-receipt.json
            docs/qa/hg17/organic-newgame-receipt.json
            docs/qa/hg17/organic-newgame-chrome.json
            docs/qa/hg18/core-progression.json
            docs/qa/hg18/hg18-chrome.json
            docs/qa/hg19/art-pack.json
            docs/qa/hg19/chrome-art.json
            docs/qa/hg19/contact-sheet.png
            docs/qa/hg191/free-assets.json
            docs/qa/hg191/free-assets-chrome.json
            docs/qa/hg191/free-sprites-and-icons.png
            docs/evidence/hg18/daily-weekly-quests-chrome.png
            docs/evidence/hg18/hero-rebirth-forge-chrome.png
            docs/evidence/hg17/rookie-first-mine-chromium.png
            docs/evidence/hg12/hero-task-*.png
            docs/qa/hg12/hero-task-chrome.json
            docs/evidence/hg14/battle-*.png
            docs/qa/hg14/batch01-chrome.json
            assets/generated/hg143/animation/human-archer-atlas.png
            assets/generated/hg143/animation/human-archer-atlas.json
            docs/qa/hg143/archer-art-qa.json
            docs/qa/hg143/archer-chrome.json
            docs/evidence/hg143/*.png
            docs/evidence/hg145/*.png
            docs/qa/hg145/grid-hp-fx-chrome.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG22.1 battle art source and real Chrome frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG22.1-Undead-Skeleton-50-frames
          path: |
            docs/qa/hg22/skeleton-source.json
            docs/qa/hg22/skeleton-chrome.json
            docs/qa/hg22/skeleton-five-actions.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload HG19.3 final seven source images and Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG19.3-final-40-troop-art
          path: |
            docs/qa/hg193/assets.json
            docs/qa/hg193/chrome-art.json
            docs/qa/hg193/contact-sheet.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload HG19.2 sourced-creature artwork and QA independently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG19.2-fantasy-source-creatures
          path: |
            docs/qa/hg192/source-assets.json
            docs/qa/hg192/chrome-art.json
            docs/qa/hg192/creature-contact-sheet.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload HG19.1 source-art screenshots and QA independently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG19.1-free-fantasy-sprite-review
          path: |
            docs/qa/hg191/free-assets.json
            docs/qa/hg191/free-assets-chrome.json
            docs/qa/hg191/free-sprites-and-icons.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG16 G4 stress receipt even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG16-G4-core-stress
          path: docs/qa/hg16/g4-stress-receipt.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG18 actual Chrome UI evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG18-quest-rebirth-Chromium
          path: |
            docs/qa/hg18/hg18-chrome.json
            docs/evidence/hg18/daily-weekly-quests-chrome.png
            docs/evidence/hg18/hero-rebirth-forge-chrome.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG18.1 popup and viewport screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG18.1-window-UX-Chromium
          path: |
            docs/qa/hg181/window-chrome.json
            docs/evidence/hg181/*.png
          if-no-files-found: ignore
      - name: Upload HG18 progression QA even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG18-quest-items-hero-progression
          path: docs/qa/hg18/core-progression.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG18.2 economy XP and AP receipts even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG18.2-economy-XP-AP
          path: docs/qa/hg182/balance.json
          if-no-files-found: ignore
      - name: Upload HG18.1 organic endgame receipt even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG18.1-organic-endgame
          path: docs/qa/hg181/organic-endgame.json
          if-no-files-found: ignore
      - name: Upload HG17 New Game economic-loop evidence even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG17-unseeded-playthrough
          path: docs/qa/hg17/organic-newgame-receipt.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG17 real Chromium New Game evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG17-organic-Chromium
          path: |
            docs/qa/hg17/organic-newgame-chrome.json
            docs/evidence/hg17/rookie-first-mine-chromium.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload actual Chrome viewport evidence even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG09-combat-viewport-Chrome-evidence
          path: |
            docs/evidence/hg09/fullscreen-combat-*.png
            docs/qa/hg09/fullscreen-combat-chrome.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG12 Hero Tasks Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG12-HeroTasks-Chrome-evidence
          path: |
            docs/evidence/hg12/hero-task-*.png
            docs/qa/hg12/hero-task-chrome.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG14 real battle screenshots even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG14-four-races-sprite-Chrome-evidence
          path: |
            docs/evidence/hg14/battle-*.png
            docs/qa/hg14/batch01-chrome.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG14.3 source-registered Archer atlas and 48 separate frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG14.3-Human-Archer-48-frame-Atlas-evidence
          path: |
            assets/generated/hg143/animation/human-archer-atlas.png
            assets/generated/hg143/animation/human-archer-atlas.json
            assets/generated/hg143/animation/frames/*.png
            docs/qa/hg143/archer-art-qa.json
            docs/qa/hg143/archer-chrome.json
            docs/evidence/hg143/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HG14.5 tactical grid, HP and combat FX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG14.5-grid-HP-real-PvE-Chromium-evidence
          path: |
            docs/evidence/hg145/*.png
            docs/qa/hg145/grid-hp-fx-chrome.json
          retention-days: 7
          if-no-files-found: warn
