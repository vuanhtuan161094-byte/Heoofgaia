name: Heoofgaia offline combat QA
on:
  push:
    branches:
      - feature/hog1-research-to-playable-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for reproducible sprite processing
        run: python -m pip install Pillow==11.3.0
      - name: Build current offline HTML reproducibly
        run: |
          python -m py_compile build_offline.py tools/prepare_hg33_human_vanguard.py tools/prepare_hg33_troop_atlases.py
          node --check art-hg33-troop-atlases.js
          python -m py_compile tools/prepare_hg33_elf_scout.py
          python tools/prepare_hg33_elf_scout.py
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-first.sha
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-second.sha
          diff -u /tmp/heoofgaia-first.sha /tmp/heoofgaia-second.sha
      - name: HG33 H0 inventory and H5 external-art release gate
        run: |
          node --check qa-hg33-inventory.cjs
          node qa-hg33-inventory.cjs
      - name: HG33 H2 six layered original action-atlas sources
        run: |
          python -m py_compile tools/build_hg33_h2_editable_sources.py
          python tools/build_hg33_h2_editable_sources.py --check
      - name: QA source-registered 48-frame Human Archer PNG atlas
        run: python qa-hg143-archer-art.py
      - name: Check gameplay and battle viewport
        run: |
          node --check app.js
          node --check painter.js
          node --check engine.js
          node --check hg40-tactical.js
          node qa-engine.cjs
          node --check qa-hg39-engine.cjs
          node qa-hg39-engine.cjs
          node qa-hg28-art.cjs
          node qa-hg09-combat-viewport.cjs
          node --check qa-hg33-hex.cjs
          node qa-hg33-hex.cjs
          node --check qa-hg33-assets.cjs
          node qa-hg33-assets.cjs
      - name: HG28 animation 40-unit source authenticity and five-action atlas-packer gate
        run: |
          node --check qa-hg28-animation-coverage.cjs
          node qa-hg28-animation-coverage.cjs
          python -m py_compile tools/pack_hg28_action_frames.py
          python tools/pack_hg28_action_frames.py --unit human_4 --source assets/licensed/kaykit-heavy-soldier/rendered --output docs/qa/hg28-animation-pack-smoke --cell 192
          python -c "import json; from pathlib import Path; m=json.loads(Path('docs/qa/hg28-animation-pack-smoke/atlas-manifest.json').read_text()); assert len(m['clips']) == 5 and sum(x['frames'] for x in m['clips'].values()) == 57"
      - name: HG16 G4 core combat and production stress gate
        run: |
          node --check qa-hg16-g4-stress.cjs
          node qa-hg16-g4-stress.cjs
      - name: HG17 unseeded New Game to second castle gate
        run: |
          node --check qa-hg17-organic-newgame.cjs
          node qa-hg17-organic-newgame.cjs
      - name: HG18 equipment and quest economy progression gate
        run: |
          node --check hg18.js
          node --check qa-hg18-core.cjs
          node qa-hg18-core.cjs
      - name: HG18.2 elite logistics, NPC XP and scouting AP balance
