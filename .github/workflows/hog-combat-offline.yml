name: Heoofgaia offline combat QA
on:
  push:
    branches:
      - feature/hog1-research-to-playable-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build current offline HTML reproducibly
        run: |
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-first.sha
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html > /tmp/heoofgaia-second.sha
          diff -u /tmp/heoofgaia-first.sha /tmp/heoofgaia-second.sha
      - name: Check gameplay and battle viewport
        run: |
          node --check app.js
          node --check painter.js
          node --check engine.js
          node qa-engine.cjs
          node qa-hg09-combat-viewport.cjs
      - name: Install headless Chromium for actual battlefield acceptance
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Chrome battlefield viewport, pointer and Save/Reload acceptance
        run: python qa-hg09-combat-viewport-chrome.py
      - name: Record build SHA and size
        run: |
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html | tee Build-SHA256.txt
          wc -c Play-Heoofgaia-HG11.html
      - name: Upload offline playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: Play-Heoofgaia-HG11
          path: |
            Play-Heoofgaia-HG11.html
            Build-SHA256.txt
            docs/evidence/hg09/fullscreen-combat-*.png
            docs/qa/hg09/fullscreen-combat-chrome.json
          retention-days: 7
          if-no-files-found: error
