name: HG40.9 Purple PvE CS1-10 and item cards real Chromium
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg409-enemy-commanders.js'
      - 'app.js'
      - 'index.html'
      - 'style-hg03.css'
      - 'build_offline.py'
      - 'qa-hg409-pve-commanders.cjs'
      - 'qa-hg409-pve-chrome.py'
      - '.github/workflows/hg409-pve-purple.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real engine purple enemy CS1-10, Boss, Tower and paid reward tests
        run: |
          node --check hg409-enemy-commanders.js
          node --check app.js
          node --check qa-hg409-pve-commanders.cjs
          node qa-hg409-pve-commanders.cjs
      - name: Build EXACTLY one real offline HTML with combat and assets
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Actual Chromium four-viewports item-card, enemy preview and combat HUD
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg409-pve-chrome.py
          python qa-hg409-pve-chrome.py
      - name: Upload real QA receipts and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG409-Purple-CS10-Real-Chromium-QA
          path: |
            docs/qa/hg409/*.json
            docs/evidence/hg409/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Deliver SAME single tested offline game file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG409-Playable-Single-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
