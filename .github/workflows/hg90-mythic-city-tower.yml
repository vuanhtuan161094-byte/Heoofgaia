name: HG90 Full Tower Replay Mythic Bonds Gear Troops and Secondary City
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg90-mythic-progression.js
      - hg21-tower-tactical.js
      - hg88-tower-hero-cards.js
      - hg89-mythic-heroes.js
      - hg82-city-heroes.js
      - app.js
      - index.html
      - build_offline.py
      - style-hg57.css
      - qa-hg90-mythic-city-tower.cjs
      - qa-hg88-tower-hero-cards.cjs
      - qa-hg90-ui-chrome.py
      - .github/workflows/hg90-mythic-city-tower.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: hg90-exact-sha-single-html
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact SHA and full rewards + real RPG systems
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check app.js
          node --check hg21-tower-tactical.js
          node --check hg82-city-heroes.js
          node --check hg90-mythic-progression.js
          node qa-hg90-mythic-city-tower.cjs
          node qa-hg89-pantheon-joint.cjs
          node qa-hg88-tower-hero-cards.cjs
          node qa-hg82-city-heroes.cjs
          node qa-hg261-joint.cjs
          node qa-hg87-equipment.cjs
          node qa-engine.cjs
  chromium:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Produce one offline HTML
        run: |
          set -euxo pipefail
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Real Chromium PC/mobile city god forging and myth troop dispatch
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg90-ui-chrome.py
          python qa-hg89-ui-chrome.py
          python qa-hg88-ui-chrome.py
          python qa-hg82-city-heroes-chrome.py
      - name: Evidence for user
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG90-Real-PC-Mobile-Evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/evidence/hg90/*.png
            docs/qa/hg90/*.json
      - name: Single final playable HTML file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG90-Heroes-of-Gaia-ONE-HTML
          retention-days: 30
          if-no-files-found: error
          path: Play-Heoofgaia-HG11.html
