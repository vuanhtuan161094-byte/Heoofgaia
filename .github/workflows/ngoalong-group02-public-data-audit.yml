name: Group02 Wiki public data accessibility audit
on:
  push:
    branches: ['codex/nl-wiki-01-r02-20261117']
    paths: ['.github/workflows/ngoalong-group02-public-data-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect metadata of public Wiki HTML hydration and JSON requests
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlsplit
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={"width":1280,"height":720})
            requests=[]
            def capture(r):
              kind=(r.headers.get('content-type') or '')
              if 'json' in kind or '/api/' in urlsplit(r.url).path:
                u=urlsplit(r.url)
                requests.append({"host":u.hostname,"path":u.path,"status":r.status,
                    "contentType":kind[:70]})
            page.on('response',capture)
            snapshots=[]
            for suffix in ('/pho-ban','/pho-ban-chi-tiet?map=3','/pho-ban-chi-tiet?map=3&ai=108&side=vn'):
              page.goto('https://ngoalong.vnggames.com/ngoa-long-wiki'+suffix,
                wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(1500)
              meta=page.evaluate("""() => ({
                title:document.title,
                nextData:!!document.querySelector('script#__NEXT_DATA__'),
                jsonScriptLengths:[...document.querySelectorAll('script[type="application/json"]')].map(s=>s.textContent.length).slice(0,10),
                scriptCount:document.scripts.length,
                npcLinks:document.querySelectorAll('a[data-nlw-camp-ai]').length,
                formationButtons:document.querySelectorAll('button[data-nlw-camp-o^="npc:"]').length,
                dataAttributes:[...new Set([...document.querySelectorAll('[data-nlw]')].flatMap(x=>x.getAttributeNames().filter(a=>a.startsWith('data-nlw'))))].slice(0,15)
              })""")
              snapshots.append({"page":suffix, "meta":meta})
            out={"source":"https://ngoalong.vnggames.com/ngoa-long-wiki/pho-ban",
               "scope":"PUBLIC_METADATA_ONLY","snapshots":snapshots,
               "jsonRequests":list({(x["host"],x["path"],x["status"]):x for x in requests}.values())}
            Path('group02-public-data-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
            print(json.dumps(out,ensure_ascii=False,indent=2))
            browser.close()
          PY
      - name: Inspect official public per-map JSON schema without importing content
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://cdn-mainsite-aka.vnggames.com/products/mwly/landing/2026-ngoa-long-wiki-clone/data/campaign/'
          def typ(v):
            if isinstance(v,dict):return {"type":"dict","keys":list(v)[:45],"len":len(v),"samples":{k:typ(x) for k,x in list(v.items())[:6]}}
            if isinstance(v,list):return {"type":"list","len":len(v),"sample":typ(v[0]) if v else None}
            return type(v).__name__
          for mid in (1,3,269):
            u=base+str(mid)+'.json'
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (research source audit)'})
              with urllib.request.urlopen(req,timeout=30) as r:
                b=r.read(12000000)
                data=json.loads(b)
              print("MAP_SCHEMA",mid,json.dumps({"sizeBytes":len(b),"schema":typ(data)},ensure_ascii=False))
            except Exception as e:print("MAP_ERROR",mid,type(e).__name__,str(e)[:250])
          PY
      - name: Upload metadata audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group02-public-data-access-audit
          path: group02-public-data-audit.json
          if-no-files-found: warn
