name: HG40.7 combat visual foot-lock and VFX real Chromium
on:
  push:
    branches:
      - feature/hog1-research-to-playable-20261102
    paths:
      - painter.js
      - qa-hg407-combat-presentation.cjs
      - .github/workflows/hg407-combat-visual-fast.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual sprite anchor, hitbox, effect receipt and Save v07 source tests
        run: |
          node --check painter.js
          node --check qa-hg407-combat-presentation.cjs
          node qa-hg407-combat-presentation.cjs
          node qa-hg403-presentation.cjs
          node qa-hg33-hex.cjs
      - name: Build one real offline HTML with updated combat renderer
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
      - name: Chromium live 40 skills, actual battle Canvas and animation sources
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg403-visual-gate-chrome.py
      - name: Chromium 60Hz combat, HUD, foot placement and Save v07
        run: python qa-hg34-combat-smooth-chrome.py
      - name: Upload genuine battle screenshot and QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG407-40Troop-Foot-VFX-Real-Chromium-Evidence
          path: |
            docs/qa/hg403/visual-gate.json
            docs/evidence/hg403/visual-gate/*.png
            docs/qa/hg34/combat-smooth-chrome.json
            docs/evidence/hg34/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload same-checkout single playable HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG407-Playable-Single-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
