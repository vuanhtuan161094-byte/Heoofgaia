name: HG40.6 phone landscape map-first real Chromium
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - app.js
      - style-hg03.css
      - qa-hg405-desktop-phone-chrome.py
      - .github/workflows/hg406-phone-map-fast.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build one real playable offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Chromium desktop and 844x390, 768x260, 412x915 phone test
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg405-desktop-phone-chrome.py
          python qa-hg405-desktop-phone-chrome.py
      - name: Upload actual PC/phone screenshots and geometry receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG406-Phone-Map-Real-Chromium-Evidence
          path: |
            docs/qa/hg405/desktop-phone-chrome.json
            docs/evidence/hg405/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload single playable HTML from same tested checkout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG406-Playable-Single-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
