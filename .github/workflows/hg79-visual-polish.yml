name: HG79 Visual Polish - animated monsters, hero portraits and world map
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - painter.js
      - app.js
      - style-hg57.css
      - qa-hg79-polish.cjs
      - qa-hg79-polish-chrome.py
      - .github/workflows/hg79-visual-polish.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg79-one-branch-visual
  cancel-in-progress: true
jobs:
  visual-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA, syntax, presentation and engine Save v07
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check painter.js
          node --check app.js
          node --check qa-hg79-polish.cjs
          node qa-hg79-polish.cjs
          node qa-engine.cjs
          node qa-hg75-tactics.cjs
          node qa-hg407-combat-presentation.cjs
  visual-chromium:
    needs: visual-core
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build same one self-contained offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Install real Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 'HG79 real browser: maps, NPC art, hero identity, Save and mobile pinch'
        run: python qa-hg79-polish-chrome.py
      - name: 'Regression: desktop plus actual Chrome touch mobile maps'
        run: python qa-hg405-desktop-phone-chrome.py
      - name: 'Regression: true battle controls and Save v07 four-viewports'
        run: python qa-hg75-chrome.py
      - name: Upload screenshot and measurable browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG79-World-Combat-Hero-Real-Chromium-Evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/qa/hg79/*.json
            docs/evidence/hg79/*.png
            docs/qa/hg405/*.json
            docs/evidence/hg405/*.png
            docs/qa/hg75/*.json
            docs/evidence/hg75/*.png
      - name: Deliver exactly one tested playable offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HEOOFGAIA-HG79-ONE-HTML-ANDROID-PC
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
