name: HG67 Azrael Real Hit and 145 Sprite Animation QA
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths: [painter.js, qa-hg33-h2-pilot-live-chrome.py, .github/workflows/hg67-azrael-h2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-azrael-hit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SHA, motion integrity and real 3-hero HP
        run: |
          git rev-parse HEAD
          node --check painter.js
          node qa-hg58-combat.cjs
      - name: Build one offline HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: Chromium five live actors and 145 visual/source/Save receipts
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg33-h2-pilot-live-chrome.py
      - name: Actual screenshots and machine-readable QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG67-Original-Actor-145-QA-Evidence
          path: |
            docs/qa/hg33/H2-six-pilot-live-chrome.json
            docs/evidence/hg33/H2-six-pilot-live/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Final single offline HTML after success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG67-Single-Offline-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
