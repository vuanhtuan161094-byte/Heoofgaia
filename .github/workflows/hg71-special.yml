name: HG71 Exclusive Quest Hero and Item Inventory QA
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg71-quest-heroes.js
      - hg408-hero-management.js
      - app.js
      - style-hg57.css
      - index.html
      - build_offline.py
      - qa-hg71-special-hero.cjs
      - .github/workflows/hg71-special.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hero-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exactly one quest hero, original cooldown and strict Save
        run: |
          git rev-parse HEAD
          node --check hg71-quest-heroes.js
          node --check app.js
          node --check painter.js
          node qa-hg71-special-hero.cjs
          node qa-hg408-heromanagement.cjs
          node qa-hg69-endurance.cjs
      - name: Single-file offline build with script inclusion
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
      - name: PC and mobile real Chromium inventory, Save and reward
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg63-chrome.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG71-Quest-Skill-and-Gear-Evidence
          path: |
            docs/qa/hg63/*.json
            docs/evidence/hg63/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: One bundled game HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG71-One-Playable-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
