name: Group02 inspect public NPC button navigation once
on:
  push:
    branches: ['codex/nl-wiki-01-r02-20261117']
    paths: ['.github/workflows/ngoalong-group02-dom-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect public map page UI structure without exporting protected content
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            page=b.new_page()
            page.goto('https://ngoalong.vnggames.com/ngoa-long-wiki/pho-ban-chi-tiet?map=1',wait_until='domcontentloaded',timeout=60000)
            page.wait_for_timeout(2000)
            result=page.evaluate("""() => ({
               title: document.title,
               buttons:[...document.querySelectorAll('button,[role="button"],a')].filter(e=>/Cấp|BOSS|Chiến công|NPC/.test((e.innerText||'').slice(0,180))).slice(0,16).map(e=>({
                 tag:e.tagName,role:e.getAttribute('role'),
                 className:String(e.className).slice(0,150),
                 text:(e.innerText||'').slice(0,130),
                 outer:e.outerHTML.slice(0,450)})),
               anchors:[...document.querySelectorAll('a[href*="ai="]')].map(e=>e.href).slice(0,5),
               headings:[...document.querySelectorAll('h1,h2,h3')].map(e=>(e.innerText||'').slice(0,90)),
               next:[...document.querySelectorAll('button')].filter(e=>/Sau/.test(e.innerText||'')).map(e=>({text:e.innerText,disabled:e.disabled}))
            })""")
            print(json.dumps(result,ensure_ascii=False,indent=2))
            b.close()
          PY
