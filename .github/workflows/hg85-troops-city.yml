name: HG85 4000 Special Troops - Flicker-free City
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg27-farm-exchange.js
      - hg30-troop-ascension.js
      - app.js
      - qa-hg27-farm.cjs
      - qa-hg30-ascension.cjs
      - qa-hg81-heroes.cjs
      - qa-hg30-ui-chrome.py
      - qa-hg85-troop-conversion.cjs
      - qa-hg85-city-no-flicker-chrome.py
      - .github/workflows/hg85-troops-city.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg85-special-troops-city-one-branch
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact SHA, 4000-unit exchange, true cost, v07 regression
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check app.js
          node --check hg27-farm-exchange.js
          node --check hg30-troop-ascension.js
          node --check qa-hg85-troop-conversion.cjs
          node qa-hg85-troop-conversion.cjs
          node qa-hg27-farm.cjs
          node qa-hg30-ascension.cjs
          node qa-hg81-heroes.cjs
          node qa-engine.cjs
  chromium:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build the canonical ONE HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Real Chromium desktop and Android-landscape canvas continuity and troop conversion
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg85-city-no-flicker-chrome.py
          python qa-hg30-ui-chrome.py
          python qa-hg27-ui-chrome.py
      - name: HG85 screenshots and QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG85-Troops-City-Evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/evidence/hg85/*.png
            docs/qa/hg85/*.json
            docs/qa/hg30-ui.json
            docs/evidence/hg30/*.png
      - name: HG85 only playable offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG85-Heroes-of-Gaia-ONE-HTML
          retention-days: 30
          if-no-files-found: error
          path: Play-Heoofgaia-HG11.html
