name: HG87 Equipment Completion - Epic Forge, Safe Salvage and One HTML
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg73-gear-prestige.js
      - hg18.js
      - hg46-equipment.js
      - app.js
      - style-hg57.css
      - qa-hg87-equipment.cjs
      - qa-hg87-ui-chrome.py
      - .github/workflows/hg87-equipment.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg87-equipment-one-html
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: HG87 actual paid forge, UID protection, atomic salvage and strict v07
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check app.js
          node --check hg73-gear-prestige.js
          node --check hg18.js
          node --check hg46-equipment.js
          node qa-hg87-equipment.cjs
          node qa-hg83-crown-gear.cjs
          node qa-hg73-gear.cjs
          node qa-hg47-10slot.cjs
          node qa-hg84-loot-balance.cjs
          node qa-hg85-troop-conversion.cjs
          node qa-engine.cjs
  chromium:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Bundle ONE standalone playable HTML
        run: |
          set -euxo pipefail
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Test game with Chromium on desktop and mobile landscape
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg87-ui-chrome.py
          python qa-hg73-visual-chrome.py
          python qa-hg86-rendered-art-chrome.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HG87-Equipment-Real-UI-Evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/evidence/hg87/*.png
            docs/qa/hg87/*.json
            docs/evidence/hg73/*.png
            docs/qa/hg73/*.json
            docs/evidence/hg86/*.png
            docs/qa/hg86/*.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HG87-Heroes-of-Gaia-ONE-HTML
          retention-days: 30
          if-no-files-found: error
          path: Play-Heoofgaia-HG11.html
