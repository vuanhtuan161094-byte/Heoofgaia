name: NL Item Wiki Public Index Research (Group 08 candidate only)
on:
  push:
    branches: [feature/nl-mcv2-08-items-integration]
    paths:
      - '.github/workflows/nl-items-wiki-capture.yml'
      - 'tools/nl_item_collect_wiki_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiki_snapshot:
    if: github.ref == 'refs/heads/feature/nl-mcv2-08-items-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public research browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture public 674-index accordion rows (source data only)
        run: python tools/nl_item_collect_wiki_v1.py
