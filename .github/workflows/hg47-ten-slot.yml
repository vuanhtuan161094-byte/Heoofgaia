name: HG47 10-slot racial equipment, earned shards and Save v07
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'hg47-ten-slot.js'
      - 'hg46-equipment.js'
      - 'hg18.js'
      - 'hg29-loot.js'
      - 'hg31-legendary-gear.js'
      - 'app.js'
      - 'index.html'
      - 'style-hg03.css'
      - 'build_offline.py'
      - 'qa-hg47-10slot.cjs'
      - 'qa-hg47-ui-chrome.py'
      - 'qa-hg46-equipment-chrome.py'
      - '.github/workflows/hg47-ten-slot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg47-feature-branch
  cancel-in-progress: true
jobs:
  ten-slot-and-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ten-slot, four-race, real loot, Boss-Tower and Save v07 engine
        run: |
          node --check hg47-ten-slot.js
          node --check app.js
          node --check qa-hg47-10slot.cjs
          echo "HG47 exact SHA: $(git rev-parse HEAD)"
          node qa-hg47-10slot.cjs
          node qa-hg46-equipment.cjs
          node qa-hg46b-balance.cjs
          node qa-hg29-loot.cjs
          node qa-hg31-legendary.cjs
          node qa-hg18-core.cjs
          node qa-hg40-tactical.cjs
      - name: Build one canonical standalone HTML
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
          sha256sum Play-Heoofgaia-HG11.html
          node qa-engine.cjs
      - name: Chromium 5 phone/desktop viewports and v07 cold Save
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m py_compile qa-hg47-ui-chrome.py qa-hg46-equipment-chrome.py qa-hg408-hero-chrome.py qa-hg29-ui-chrome.py qa-hg31-ui-chrome.py
          python qa-hg47-ui-chrome.py
          python qa-hg46-equipment-chrome.py
          python qa-hg408-hero-chrome.py
          python qa-hg29-ui-chrome.py
          python qa-hg31-ui-chrome.py
      - name: Evidence for every pass/fail, no generated victory receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG47-Ten-Slot-Real-QA-Evidence
          path: |
            docs/qa/hg47/*.json
            docs/evidence/hg47/*.png
            docs/qa/hg46/*.json
            docs/evidence/hg46/*.png
            docs/qa/hg408/*.json
            docs/evidence/hg408/*.png
            docs/qa/hg29/*.json
            docs/evidence/hg29/*.png
            docs/qa/hg31/*.json
            docs/evidence/hg31/*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: ONE final HTML playable offline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG47-Playable-Single-HTML
          path: Play-Heoofgaia-HG11.html
          retention-days: 30
          if-no-files-found: error
