name: HG88 Tower Reset Special Heroes 500 and World Map
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - hg18.js
      - hg21-tower-tactical.js
      - hg88-tower-hero-cards.js
      - app.js
      - painter.js
      - style-hg57.css
      - build_offline.py
      - index.html
      - qa-hg88-tower-hero-cards.cjs
      - qa-hg88-ui-chrome.py
      - qa-hg87-ui-chrome.py
      - .github/workflows/hg88-tower-heroes.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg88-tower-heroes-one-game
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact SHA, real v07 economy and Tower reset/hero cards
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --check app.js
          node --check hg21-tower-tactical.js
          node --check hg88-tower-hero-cards.js
          node --check hg18.js
          node qa-hg88-tower-hero-cards.cjs
          node qa-hg21-tactical.cjs
          node qa-hg18-core.cjs
          node qa-hg87-equipment.cjs
          node qa-hg84-loot-balance.cjs
          node qa-hg85-troop-conversion.cjs
          node qa-engine.cjs
  chromium:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Produce exactly ONE HTML offline release
        run: |
          set -euxo pipefail
          python -m pip install Pillow==11.3.0
          python build_offline.py
          test -s Play-Heoofgaia-HG11.html
          sha256sum Play-Heoofgaia-HG11.html
      - name: Real Chromium PC and phone Tower reset, summoned heroes and world
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python qa-hg88-ui-chrome.py
          python qa-hg87-ui-chrome.py
          python qa-hg86-rendered-art-chrome.py
      - name: HG88 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG88-Tower-Heroes-World-Evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            docs/evidence/hg88/*.png
            docs/qa/hg88/*.json
            docs/evidence/hg87/*.png
            docs/qa/hg87/*.json
      - name: ONE canonical offline HTML HG88
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HG88-Heroes-of-Gaia-ONE-HTML
          retention-days: 30
          if-no-files-found: error
          path: Play-Heoofgaia-HG11.html
