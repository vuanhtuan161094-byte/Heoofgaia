name: HG91 P0 HG39 Map Dispatch and Save v07
on:
  push:
    branches: [feature/hog1-research-to-playable-20261102]
    paths:
      - 'qa-hg39-map-dispatch-chrome.py'
      - 'app.js'
      - 'engine.js'
      - 'hg82-city-heroes.js'
      - 'hg56-ui.js'
      - '.github/workflows/hg91-hg39-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hg91-p0-hg39
  cancel-in-progress: true
jobs:
  focused-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check authoritative map and city hero engine
        run: |
          node --check app.js
          node --check engine.js
          node qa-hg39-engine.cjs
      - name: Build sole offline game, preserving Save v07
        run: |
          python -m pip install Pillow==11.3.0
          python build_offline.py
      - name: Genuine Chromium map dispatch, three viewport and cold reload
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python qa-hg39-map-dispatch-chrome.py
      - name: HG39 real browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG91-P0-HG39-Real-Chromium-Evidence
          path: |
            docs/qa/hg39/*.json
            docs/evidence/hg39/*.png
          if-no-files-found: ignore
          retention-days: 30
