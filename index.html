<style>

*{box-sizing:border-box}html,body{padding:0;margin:0;height:100%;font-family:'Be Vietnam Pro',system-ui,Segoe UI,sans-serif;color:var(--cream);background:var(--bg)}button{font:inherit;cursor:pointer}button:disabled{opacity:.36;cursor:not-allowed}#app{min-height:100vh;background:radial-gradient(circle at 82% 0,rgba(105,120,75,.12),transparent 32%),linear-gradient(125deg,#0b171a,#132225 60%,#0a1418)}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1540px;min-height:calc(100vh - 90px);margin:auto}.sidebar{border-right:1px solid #4c5b4b75;padding:22px 14px;background:#0e1b20cc;display:flex;flex-direction:column;gap:6px}.ruler{border-bottom:1px solid #49604d;margin:0 5px 19px;padding:0 0 19px;display:flex;gap:11px;align-items:center}.ruler-mark{height:40px;width:40px;background:#3c3e2b;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:21px;border-radius:4px}.ruler b{font-size:13px;display:block}.ruler span{font-size:10px;color:var(--muted)}.nav{border:1px solid transparent;border-radius:7px;text-align:left;color:#b4c7ba;background:transparent;padding:14px 14px;display:flex;align-items:center;gap:11px;font-size:13px}.nav:hover{background:#254037}.nav.active{background:linear-gradient(90deg,#6f5432,#3b3428 90%);border-color:#bb965c;color:#fff0ce;box-shadow:inset 3px 0 0 #f0c47b}.nav .ico{font-size:19px;width:26px;text-align:center}.side-foot{margin-top:auto;padding:16px 10px;color:#748a84;font-size:10px;line-height:1.8}.main{padding:22px 27px 35px;overflow:hidden}.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.head h1{font-family:Georgia,'Times New Roman',serif;margin:0 0 4px;font-size:29px;color:var(--gold2);font-weight:700;letter-spacing:.4px}.head p{margin:0;color:var(--muted);font-size:12px}.section-label{font-size:11px;color:#edc98a;letter-spacing:2px;text-transform:uppercase}.pill{padding:7px 12px;border-radius:20px;font-size:11px;border:1px solid #857451;background:#392f22;color:var(--gold2)}.panel{background:linear-gradient(145deg,#1b3131,#112327 90%);border:1px solid #57715b77;box-shadow:0 10px 35px #050a0b40;border-radius:9px}.gold-button{background:linear-gradient(#eac789,#b98949);border:1px solid #f0d7a5;color:#1e221c;font-weight:800;padding:11px 16px;border-radius:5px;box-shadow:0 3px 0 #735332}.gold-button:hover:not(:disabled){filter:brightn /* 城 / city */
.city-visual{min-height:440px;position:relative;overflow:hidden;border-radius:9px;border:1px solid #6c785b;background:radial-gradient(ellipse at 50% 60%,#425b47 0 11%,transparent 62%),linear-gradient(180deg,#233f3c 0%,#324d42 40%,#233a35 100%)}.city-visual:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 58px,#a9aa7330 59px 60px),repeating-linear-gradient(90deg,transparent 0 74px,#bbc08e1a 75px 76px);transform:skewY(-8deg) scale(1.4);opacity:.28}.city-visual:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#1429227c,transparent 23% 78%,#14292264),linear-gradient(0deg,#112322a9,transparent 27%)}.city-mountain{position:absolute;width:160%;left:-30%;top:-220px;height:350px;opacity:.38;background:linear-gradient(145deg,transparent 47%,#8aa093 48%,#273d3e 65%,transparent 66%);transform:rotate(-8deg);pointer-events:none}.city-path{position:absolute;left:9%;width:85%;top:51%;height:39px;background:#ae986559;transform:rotate(0deg);border:2px solid #b8a77534;box-shadow:0 0 0 8px #45634b3b}.building{position:absolute;transform:translate(-50%,-50%);z-index:2;background:linear-gradient(160deg,#344742,#132522);color:var(--cream);border:1px solid #9a8152;border-radius:8px;min-width:115px;padding:12px 9px 9px;box-shadow:0 9px 0 #091a18b0,0 14px 14px #05110fbf;text-align:center;transition:transform .16s,filter .16s}.building:hover{transform:translate(-50%,-54%);filter:brightness(1.22)}.building .roof{position:absolute;left:-6%;top:-16px;width:112%;height:24px;background:linear-gradient(#805d39,#4d3e2d);clip-path:polygon(0 70%,13% 35%,50% 5%,87% 35%,100% 70%,92% 90%,8% 90%);border-bottom:2px solid #dab478}.building .symbol{font-size:31px;display:block;filter:drop-shadow(0 4px 4px #04110f)}.building b{display:block;font-size:12px;color:#ffe1a1}.building small{display:block;font-size:10px;color:#d6dfcd;margin-top:3px}.building.palace{min-width:167px;padding:21px 12px 13px;box-shadow:0 0 0 /* battle */
.battle-overlay{position:fixed;inset:0;background:#04090bdf;z-index:60;display:grid;place-items:center;padding:16px}.battle-window{width:min(1110px,100%);background:linear-gradient(#1d2d2b,#101d21);border:2px solid #9a824f;box-shadow:0 22px 60px #000; border-radius:9px;overflow:hidden}.battle-head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #7a6c45;background:#25362e;gap:12px}.battle-head h2{font-family:Georgia,serif;font-size:20px;color:var(--gold2);margin:0}.battle-head small{font-size:11px;color:#b6c6ae}.battle-tools{display:flex;gap:7px}.speed{padding:8px 11px;background:#182b2c;color:#e3d5b8;border:1px solid #667962;border-radius:5px}.speed.active{background:#8b6739;color:#fff6d7}.battle-canvas-wrap{position:relative;background:#102b2b}.battle-canvas-wrap canvas{display:block;width:100%;height:auto;max-height:57vh;object-fit:contain}.battle-footer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 20px;align-items:center}.combat-text{min-height:35px;font-size:12px;color:#c8d4c1}.combat-text b{color:#eac988}.battle-result{position:absolute;inset:0;background:#061411da;display:grid;place-items:center;text-align:center}.result-box{background:linear-gradient(#3a4938,#152a27);border:2px solid #b69c5c;border-radius:9px;padding:25px 40px;min-width:min(420px,95%);box-shadow:0 8px 30px #0009}.result-box .win{font-family:Georgia,serif;font-size:41px;color:#fbe3a1}.result-box .lose{font-family:Georgia,serif;font-size:41px;color:#d39c90}.result-box p{color:#d9d7be;font-size:13px}.result-box button{margin:10px 5px}

function dayId(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function extDefaults(){return {nation:'thuc',nationLocked:false,technology:Object.fromEntries(Object.keys(TECHNOLOGY).map(k=>[k,0])),items:[{uid:1,base:'b_sword',lv:1},{uid:2,base:'b_armor',lv:1},{uid:3,base:'b_book',lv:1}],gear:{},itemSeq:4,smithStock:0,activity:{day:dayId(),counts:{},claimed:[],patrols:{},arenaTries:5,towerTries:3},towerFloor:0,troopModes:{},battleReports:[],arenaScore:1000,arenaWins:0,arenaLosses:0,marketBuys:0,techSpent:0};}
function hydrateExtension(){const defaults=extDefaults();for(const [k,v] of Object.entries(defaults)) if(game[k]===undefined)game[k]=v;
 for(const k of Object.keys(TECHNOLOGY))if(!Number.isFinite(game.technology[k]))game.technology[k]=0;
 for(const id of Object.keys(game.gear)) if(!game.hero[id])delete game.gear[id];
 if(!Array.isArray(game.items))game.items=[];
 if(!game.activity||!game.activity.counts)game.activity=defaults.activity;
 resetDaily();if(!game.troopModes||typeof game.troopModes!=='object')game.troopModes={};if(!Array.isArray(game.battleReports))game.battleReports=[];game.battleReports=game.battleReports.slice(0,5);game.version=3;save();}
function resetDaily(){if(game.activity.day!==dayId()){game.activity={day:dayId(),counts:{},claimed:[],patrols:{},arenaTries:5,towerTries:3};log('Ngày mới: đặt lại nhiệm vụ, lôi đài và lượt tháp.');save();}}
function credit(kind,amount){game[kind]=(game[kind]||0)+amount;}
function payment(cost){for(const [k,v] of Object.entries(cost))if((game[k]||0)<v)return false;for(const [k,v] of Object.entries(cost))game[k]-=v;return true;}
function earnedText(r){return Object.entries(r).map(([k,v])=>({silver:'🪙',grain:'🌾',iron:'⛓️',prestige:'🏅',gems:'💠'}[k]||k)+' '+fmt(v)).join(' · ');}
function countTask(key,n=1){resetDaily();game.activity.counts[key]=(game.activity.counts[key]||0)+n;}
function shopCost(base){const eq=EQUIPMENT[base];return eq.rarity==='Truyền kỳ'?{silver:21000,iron:3800,prestige:550}:eq.rarity==='Hiếm'?{silver:4300,iron:980}:{silver:900,iron:160};}

function itemOwner(uid){for(const [id,g] of Object.entries(game.gear))if(Object.values(g).includes(uid))return id;return null;}
function equipmentStats(id){const stats={atk:0,def:0,int:0,hp:0,tdef:0,mdef:0,weaponAtk:0,horseAtk:0};for(const uid of Object.values(game.gear[id]||{})){const it=game.items.find(x=>x.uid===uid);if(!it)continue;const b=EQUIPMENT[it.base];if(!b)continue;for(const key of Object.keys(stats))stats[key]+=Math.round((b[key]||0)*(1+(it.lv-1)*.22));const bonus=Math.round((b.atk||0)*(1+(it.lv-1)*.22));if(b.slot==='weapon')stats.weaponAtk+=bonus;if(b.slot==='horse')stats.horseAtk+=bonus;}return stats;}

tem-actions"><button class="dark-button" data-equip="${it.uid}">${owner===hero?'Tháo':'Mặc'}</button><button class="gold-button" data-reinforce="${it.uid}" ${it.lv>=12?'disabled':''}>+1 · ${fmt(cost.silver)} bạc</button></div></div></div>`}).join('')}</div><div class="section-break">Lò rèn · Mua trang bị</div><div class="shop-grid">${Object.entries(EQUIPMENT).map(([id,b])=>`<div class="shop-card"><div class="feature-icon">${b.icon}</div><div><b>${b.name}</b><small>${SLOT_NAME[b.slot]} · ${b.rarity}</small><small>${earnedText(shopCost(id))}</small></div><button class="dark-button" data-buy="${id}">Mua</button></div>`).join('')}</div>`;}

function toast(msg){$('toast-mount').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast-mount').innerHTML='',3200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tick(){const now=Date.now(),elapsed=Math.min(14400000,Math.max(0,now-(game.lastTick||now))),ticks=Math.floor(elapsed/10000);if(ticks>0){game.silver+=Math.round(ticks*(12+game.buildings.market*16)*(1+game.technology.commerce*.08));game.grain+=Math.round(ticks*(10+game.buildings.farm*19)*(1+game.technology.harvest*.08));game.iron+=ticks*(5+game.buildings.mine*9);game.lastTick=(game.lastTick||now)+ticks*10000;save();if(['city','barracks'].includes(tab))render();else renderResources();}}
function renderResources(){$('resources').innerHTML=[['🪙','Đồng',game.silver],['🌾','Lương',game.grain],['⛓','Sắt',game.iron],['🏅','Uy danh',game.prestige],['💠','Ngọc',game.gems]].map(v=>`<div class="res"><span>${v[0]} ${v[1]}</span><b>${fmt(v[2])}</b></div>`).join('')}
function renderSidebar(){const n=NATIONS[game.nation];$('sidebar').innerHTML=`<div class="ruler"><div class="ruler-mark">${n.glyph}</div><div><b>Thành chủ ${n.name}</b><span>${n.capital} · Cấp ${game.buildings.palace}</span></div></div>`+NAV.map(v=>`<button class="nav ${tab===v[0]?'active':''}" data-tab="${v[0]}"><span class="ico">${v[1]}</span>${v[2]}</button>`).join('')+`<div class="side-foot">Thu tài nguyên mỗi 10 giây. <span style="color:#d8c48a">${game.cleared.length}/${STAGES.length} ải</span><div class="divider"></div>Chinh phục thiên hạ bằng mưu lược.</div>`;}
function head(kicker,title,sub,right=''){return `<div class="head"><div><div class="section-label">${kicker}</div><h1>${title}</h1><p>${sub}</p></div>${right}</div>`;}
function buildingCost(id){let l=game.buildings[id],b=BUILDINGS[id];return {silver:Math.round(b.base*Math.pow(1.75,l-1)),iron:Math.round(b.iron*Math.pow(1.65,l-1))};}
function upgrade(id){if(!BUILDINGS[id])return;const b=BUILDINGS[id],l=game.buildings[id],c=buildingCost(id);if(l>=12)return toast('Công trình đã đạt cấp tối đa.');if(id!=='palace'&&l>=game.buildings.palace+2)return toast('Cần nâng cấp Phủ Thành Chủ trước.');if(!payment(c))return toast('Không đủ đồng hoặc sắt để xây dựng.');game.buildings[id]++;countTask('upgrade');log(`Nâng cấp ${b.name} lên cấp ${l+1}.`);save();toast(`${b.name} đã lên cấp ${l+1}`);render();}
function buildingPanel(id){const b=BUILDINGS[id],l=game.buildings[id],c=buildingCost(id),blocked=(id!=='palace'&&l>=game.buildings.palace+2);return `<div class="panel mini-box"><h3>${b.icon} ${b.name} <span class="pill">Cấp ${l}</span></h3><p class="muted" style="font-size:12px;line-height:1.7;min-height:42px">${b.desc}</p><div class="line"><span class="cost">🪙 ${fmt(c.silver)} · ⛓ ${fmt(c.iron)}</span><button class="gold-button" data-upgrade="${id}" ${l>=12||blocked?'disabled':''}>${l>=12?'Tối đa':'Nâng cấp'}</button></div>${blocked?'<div class="tiny">Nâng Phủ Thành Chủ để mở giới hạn.</div>':''}</div>`;}
function renderCity(){const buildings=[['palace',49,28],['farm',18,72],['market',17,34],['mine',84,73],['barracks',67,68],['academy',81,33],['tavern',43,77]];const land=buildings.map(v=>{const b=BUILDINGS[v[0]];return `<button class="building ${v[0]==='palace'?'palace':''}" style="left:${v[1]}%;top:${v[2]}%" data-focus-building="${v[0]}"><span class="roof"></span><span class="symbol">${b.icon}</span><b>${b.name}</b><small>Cấp ${game.buildings[v[0]]}</small></button>`}).join('');const power=estimatePower();return head('Trị quốc an dân',`Thành Trì · ${NATIONS[game.nation].capital}`,'Quản lý công trình, điều phối lương thảo và chuẩn bị xuất quân.',`<span class="pill">⚔ Sức chiến đấu ${fmt(power)}</span>`)+`<div class="grid-2"><div><div class="city-visual"><div class="city-mountain"></div><div class="city-path"></div>${land}<div class="city-caption">Chạm công trình để nâng cấp hoặc quản lý</div></div><div class="small-data" style="margin-top:12px"><div class="box"><b>${game.cleared.length}/${STAGES.length}</b><span>Chinh phạt</span></div><div class="box"><b>${game.roster.length}</b><span>Võ tướng</span></div><div class="box"><b>${game.towerFloor}</b><span>Tầng tháp</span></div><div class="box"><b>${fmt(game.arenaScore)}</b><span>Lôi đài</span></div></div></div><div><div class="panel mini-box"><h3>📜 Chiếu lệnh thành chủ</h3><div class="line"><span>Quốc gia</span><b>${NATIONS[game.nation].glyph} ${NATIONS[game.nation].name}</b></div><div class="line"><span>Phủ Thành Chủ</span><b>Cấp ${game.buildings.palace}</b></div><div class="line"><span>Sản lượng bạc / 10 giây</span><b class="stat">+${Math.round((12+game.buildings.market*16)*(1+game.technology.commerce*.08))}</b></div><div class="line"><span>Sản lượng lương / 10 giây</span><b class="stat">+${Math.round((10+game.buildings.farm*19)*(1+game.technology.harvest*.08))}</b></div><div class="line"><span>Sản lượng sắt / 10 giây</span><b class="stat">+${5+game.buildings.mine*9}</b></div><div class="divider"></div><div class="quick-actions"><button class="gold-button" data-tab="campaign">🗺 Chinh phạt</button><button class="dark-button" data-tab="quests">🎁 Nhiệm vụ</button><button class="dark-button" data-tab="tech">🔬 Khoa kỹ</button><button class="dark-button" data-tab="equipment">🗡 Trang bị</button></div></div><div class="panel mini-box" style="margin-top:14px"><h3>🎯 Mục tiêu hôm nay</h3>${TASKS.slice(0,4).map(t=>{const count=Math.min(t.target,game.activity.counts[t.id]||0);return `<div class="quest"><div class="check">${game.activity.claimed.includes(t.id)?'✅':count>=t.target?'🎁':'○'}</div><div style="flex:1">${t.name}<div class="tiny">${count}/${t.target} · ${earnedText(t.reward)}</div></div></div>`}).join('')}<button class="dark-button" data-tab="quests">Xem nhiệm vụ →</button></div></div></div>`;}
function estimatePower(){return game.slots.filter(Boolean).reduce((sum,id)=>{const d=game.hero[id],h=HEROES[id],eq=equipmentStats(id);return sum+Math.round(h.atk+h.def+h.int+d.level*19+d.troops/12+eq.atk+eq.def+eq.int);},game.buildings.palace*10+game.towerFloor*8+Object.values(game.technology).reduce((a,b)=>a+b*24,0));}
function heroCard(id){const h=HEROES[id],d=game.hero[id],deployed=game.slots.includes(id),c=heroCap(id);return `<div class="hero-card ${h.rarity==='Truyền kỳ'?'legend':h.rarity==='Danh tướng'?'rare':''}"><div class="hero-top"><div class="portrait"><span class="avatar">${h.icon}</span><small>${h.type==='strategist'?'MƯU':h.type==='support'?'TRỢ':h.type==='cavalry'?'KỴ':h.type==='archer'?'CUNG':'BỘ'}</small></div><div><div class="rarity">✦ ${h.rarity.toUpperCase()}</div><div class="hero-name">${h.name}</div><div class="hero-role">${h.role} · Cấp ${d.level}</div>${deployed?'<span class="stat" style="font-size:10px">● Đang ra trận</span>':'<span class="muted" style="font-size:10px">○ Dự bị</span>'}</div></div><div class="tiny">Tuyệt kỹ: <b style="color:#e6c88c">${h.skill}</b> · ${esc(h.skillDesc)}</div><div class="progress" style="margin:6px 0 11px"><div style="width:${Math.min(100,Math.floor(d.xp/(d.level*90)*100))}%"></div></div><div class="hero-nums"><div>Võ <b>${h.atk+d.level*3}</b></div><div>Trí <b>${h.int+d.level*2}</b></div><div>Thủ <b>${h.def+d.level*3}</b></div><div>Binh <b>${fmt(d.troops)}/${fmt(c)}</b></div></div><div class="hero-actions"><button class="dark-button" data-gear-go="${id}">🗡 Trang bị</button><button class="dark-button" data-train="${id}" title="Huấn luyện 700 đồng">Rèn luyện · 700</button><button class="gold-button" data-garrison="${id}" title="Cấp tối đa 150 binh từ quân dự bị">Cấp binh</button></div></div>`;}
function heroCap(id){return 280+game.buildings.barracks*70+game.hero[id].level*35;}
function renderHeroes(){return head('Quần hùng hội tụ','Danh Sách Võ Tướng','Tăng cấp tướng, cấp thêm quân và chiêu mộ anh hùng.',`<button class="gold-button" data-recruit="1">🍵 ${game.freeRecruit?'Chiêu mộ miễn phí':'Chiêu mộ · 1.800 đồng'}</button>`)+`<div class="panel mini-box" style="margin-bottom:18px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h3 style="margin:0 0 6px">Tửu Quán · Cấp ${game.buildings.tavern}</h3><div class="tiny">Có thể chiêu mộ ${Object.keys(HEROES).length} nhân vật. Danh tướng có sức mạnh, binh chủng và chiến pháp riêng.</div></div><button class="dark-button" data-upgrade="tavern">Nâng Tửu Quán</button></div><div class="hero-grid">${game.roster.map(heroCard).join('')}</div><div class="panel mini-box" style="margin-top:18px"><h3>📖 Binh pháp dùng tướng</h3><p class="muted" style="font-size:12px;line-height:1.8">Bộ binh chịu đòn, kỵ binh xung kích, cung binh gây sát thương từ xa, mưu sĩ khống chế chiến trường, hỗ trợ hồi phục. Đội hình tối đa 5 võ tướng.</p></div>`;}
function recruit(){const free=game.freeRecruit,price=free?0:1800;if(game.roster.length===Object.keys(HEROES).length)return toast('Đã chiêu mộ toàn bộ danh tướng hiện có.');if(game.silver<price)return toast('Không đủ đồng để chiêu mộ.');game.silver-=price;game.freeRecruit=false;const pool=Object.keys(HEROES).filter(id=>!game.roster.includes(id)),weights=pool.map(id=>HEROES[id].rarity==='Truyền kỳ'?8:HEROES[id].rarity==='Danh tướng'?32:50);let r=Math.random()*weights.reduce((a,b)=>a+b,0),idx=0;for(;idx<weights.length-1;idx++)if((r-=weights[idx])<0)break;const id=pool[idx];game.roster.push(id);game.hero[id]={level:1,xp:0,troops:240};countTask('recruit');log(`Tại Tửu Quán chiêu mộ được ${HEROES[id].name}.`);save();toast(`🎉 Chiêu mộ thành công ${HEROES[id].name} (${HEROES[id].rarity})`);render();}
function train(id){if(!game.hero[id])return;const d=game.hero[id];if(game.silver<700)return toast('Không đủ 700 đồng.');if(d.level>=40)return toast('Tướng đạt cấp tối đa.');game.silver-=700;d.xp+=95+game.buildings.academy*12;let ups=0;while(d.xp>=d.level*90&&d.level<40){d.xp-=d.level*90;d.level++;ups++;}countTask('train');log(`Huấn luyện ${HEROES[id].name}${ups?` lên cấp ${d.level}`:''}.`);save();toast(ups?`${HEROES[id].name} đã lên cấp ${d.level}!`:'Đã tăng kinh nghiệm võ tướng.');render();}
function giveTroops(id){const d=game.hero[id],amount=Math.min(160,game.reserve,heroCap(id)-d.troops);if(amount<=0)return toast(game.reserve<=0?'Không còn quân dự bị. Hãy chiêu binh.':'Võ tướng đã đủ binh lực.');d.troops+=amount;game.reserve-=amount;log(`Cấp ${amount} quân cho ${HEROES[id].name}.`);save();toast(`Đã cấp ${amount} quân cho ${HEROES[id].name}`);render();}
function renderFormationLegacy(){const f=FORMATIONS[game.formation];return head('Binh vô thường thế','Bày Binh Bố Trận','Chọn võ tướng bên phải, sau đó nhấp ô muốn bố trí; nhấp ô có tướng để rút quân.',`<span class="pill">${game.slots.filter(Boolean).length}/5 vị trí</span>`)+`<div class="formation-wrap"><div class="formation-board"><div class="section-label">Chiến trận · Quân ta</div><div class="slots">${game.slots.map((id,i)=>`<button class="slot ${id?'occupied':''}" data-slot="${i}"><span class="slotno">${i+1}</span>${id?`<span class="av">${HEROES[id].icon}</span><b>${HEROES[id].name}</b><span class="tiny">${HEROES[id].role}</span>`:`<span class="av" style="color:#b8bfa9">＋</span><span class="tiny">Trận vị ${i+1}</span>`}</button>`).join('')}</div><div class="orientation">Tiền tuyến (bên phải) →</div><p class="tiny" style="line-height:1.8">Chỉ tối đa 5 võ tướng. Tướng hàng trước dễ bị chọn làm mục tiêu trước. Chọn chiến pháp để thay đổi hiệu quả toàn quân.</p></div><div class="panel mini-box"><h3>Chọn võ tướng</h3><div class="roster-list">${game.roster.map(id=>`<button class="select-hero ${selectedHero===id?'selected':''}" data-choose-hero="${id}"><span style="font-size:27px">${HEROES[id].icon}</span><span style="flex:1"><b>${HEROES[id].name}</b><br><small>${HEROES[id].role} · ${fmt(game.hero[id].troops)} quân</small></span><span>${game.slots.includes(id)?'✔':''}</span></button>`).join('')}</div></div></div><div class="panel mini-box" style="margin-top:16px"><h3>Trận pháp đang sử dụng</h3><div class="grid-3">${Object.entries(FORMATIONS).map(([id,o])=>`<button class="dark-button" style="text-align:left;${id===game.formation?'border-color:#f3d186;background:#544732':''}" data-formation="${id}"><b>${o.name}</b><div class="tiny" style="margin-top:8px">${o.desc}</div></button>`).join('')}</div><p class="tiny">${f.name}: Công ${f.atk>0?'+':''}${Math.round(f.atk*100)}% · Thủ ${f.def>0?'+':''}${Math.round(f.def*100)}% · Mưu ${f.int>0?'+':''}${Math.round(f.int*100)}%</p><button class="gold-button" data-tab="campaign" style="margin-top:8px">Đến chiến dịch →</button></div>`;}
function renderFormation(){
 const legacy=renderFormationLegacy();
 const support=game.roster.filter(id=>['support','strategist'].includes(HEROES[id].type));
 return legacy+`<div class="panel mini-box" style="margin-top:18px"><h3>🥁 Chọn binh chủng · Cổ Hiệu Quân</h3><p class="muted" style="font-size:12px;line-height:1.7">Chỉ <b>mưu sĩ / hỗ trợ</b> có thể chuyển sang tướng trống trong P2. Trống <b>không đánh thường</b>, mỗi lần hành động tăng <b>34 sĩ khí</b> đồng minh; đủ 100 sĩ khí tăng <b>55 sĩ khí</b> và giảm sĩ khí địch. Đánh đổi sát thương/chữa trị lấy nhịp chiến pháp.</p><div class="troop-choice-grid">${support.map(id=>`<div class="troop-choice"><span>${HEROES[id].icon} <b>${HEROES[id].name}</b> ${game.slots.includes(id)?'<small>· Đang ra trận</small>':''}</span><div class="quick-actions"><button class="dark-button ${game.troopModes[id]==='drum'?'':'picked'}" data-troop-mode="${id}:base">${HEROES[id].role}</button><button class="dark-button ${game.troopModes[id]==='drum'?'picked':''}" data-troop-mode="${id}:drum">🥁 Trống</button></div></div>`).join('')}</div></div>`;
}
function changeTroopMode(id,mode){
 if(!game.hero[id]||!['strategist','support'].includes(HEROES[id].type)||!['base','drum'].includes(mode))return;
 if(mode==='base')delete game.troopModes[id];else game.troopModes[id]='drum';
 log(`${HEROES[id].name} chuyển sang ${mode==='drum'?'Cổ Hiệu Quân':HEROES[id].role}.`);save();render();
}
function assignSlot(index){let current=game.slots[index];if(selectedHero){if(current===selectedHero){game.slots[index]=null;selectedHero=null;}else if(!game.slots.includes(selectedHero)&&game.slots.filter(Boolean).length>=5&&!current)return toast('Trận hình chỉ hỗ trợ tối đa năm vị trí.');else{game.slots=game.slots.map(v=>v===selectedHero?null:v);game.slots[index]=selectedHero;selectedHero=null;}}else if(current){game.slots[index]=null;}else return toast('Hãy chọn võ tướng ở danh sách bên phải.');save();render();}
function renderCampaign(){const next=game.cleared.length+1;const stage=STAGES[selectedStage-1];return head('Thiên hạ phân tranh','Chinh Phạt · Bản Đồ','Vượt từng cửa ải, thu thập chiến lợi phẩm và mở rộng uy danh.',`<span class="pill">Đã vượt ${game.cleared.length}/${STAGES.length} ải</span>`)+`<div class="grid-2"><div class="campaign-scene"><svg viewBox="0 0 900 400" preserveAspectRatio="none"><path d="M0,340 Q180,200 275,300 T530,190 T900,75" fill="none" stroke="#d6c98d" stroke-width="14" stroke-dasharray="25 15"/><path d="M0 150 C200 30 270 260 480 65 S780 220 900 50" fill="none" stroke="#7f9c7b" stroke-width="46" opacity=".25"/></svg><div class="stage-grid">${STAGES.map((s,i)=>{const n=i+1,locked=n>next,done=game.cleared.includes(n);return `<button class="stage ${locked?'locked':''} ${done?'done':''} ${selectedStage===n?'chosen':''}" data-stage="${n}" ${locked?'disabled':''}><span class="stage-icon">${locked?'🔒':done?'🏯':n%3===0?'⚔️':'🏯'}</span><strong>${s[0]}</strong><small>${done?'Đã chiến thắng':locked?'Chưa mở':'Ải '+n}</small></button>`;}).join('')}</div></div><div class="panel chapter-panel"><div class="section-label">Ải ${selectedStage} · ${selectedStage<=game.cleared.length?'Đã chiếm lĩnh':'Tiến công'}</div><h2>${stage[0]}</h2><p class="muted" style="font-size:12px;line-height:1.9">${stage[2]}<br>Thủ lĩnh địch: <b style="color:#e7cb97">${stage[1]}</b></p><div class="divider"></div><div class="tiny">Chiến lợi phẩm cơ bản</div><div class="reward" style="margin:10px 0 20px"><span>🪙 ${fmt(stage[3])} đồng</span><span>🌾 ${fmt(stage[4])} lương</span><span>🏅 ${fmt(stage[5])} uy danh</span></div><div class="line"><span>Đội ra trận</span><b>${game.slots.filter(Boolean).length} / 5 võ tướng</b></div><div class="line"><span>Tiêu hao khai chiến</span><b class="cost">🌾 ${100+selectedStage*25} lương</b></div><div class="line"><span>Độ khó</span><b class="cost">${'★'.repeat(Math.min(5,1+Math.floor(selectedStage/3)))}</b></div><button class="gold-button" data-battle="${selectedStage}" style="margin-top:20px;width:100%" ${selectedStage>next?'disabled':''}>⚔️ Xuất chiến</button><p class="tiny" style="margin-top:13px;line-height:1.8">Lõi P3: Bộ thắng Kỵ · Kỵ thắng Cung · Cung thắng Bộ; cột 3 là tuyến trước; cung ưu tiên hàng sau. Sĩ khí 100 kích hoạt chiến pháp riêng. Trống tăng sĩ khí, bỏ sát thương. Có lưu replay từng lượt.</p></div></div>`;}
function renderBarracks(){let max=500+game.buildings.barracks*400+game.technology.recruit*50;return head('Binh tinh lương túc','Doanh Trại · Quân Nhu','Tuyển quân, duy trì dự trữ và tăng cường lực lượng trước khi xuất chiến.',`<span class="pill">Quân dự bị ${fmt(game.reserve)}</span>`)+`<div class="small-data"><div class="box"><b>${fmt(game.reserve)}</b><span>Quân dự bị</span></div><div class="box"><b>${fmt(game.roster.reduce((s,id)=>s+game.hero[id].troops,0))}</b><span>Quân tại võ tướng</span></div><div class="box"><b>${fmt(max)}</b><span>Giới hạn kho quân</span></div><div class="box"><b>${game.buildings.barracks}</b><span>Cấp Doanh Trại</span></div></div><div class="grid-2" style="margin-top:18px"><div class="panel mini-box"><h3>🏹 Tuyển Binh</h3><p class="muted" style="font-size:12px;line-height:1.9">Chiêu tập 300 binh sĩ bổ sung quân dự bị. Cấp quân cho võ tướng tại mục Võ Tướng.</p><div class="line"><span>Chi phí mỗi lần</span><span class="cost">🪙 600 · 🌾 450</span></div><button class="gold-button" data-enlist="1" style="margin-top:14px">Tuyển 300 quân</button></div>${buildingPanel('barracks')}</div><div class="panel mini-box" style="margin-top:18px"><h3>Quân số các tướng</h3>${game.roster.map(id=>`<div class="line"><span>${HEROES[id].icon} ${HEROES[id].name}</span><span>${fmt(game.hero[id].troops)} / ${fmt(heroCap(id))} <button class="dark-button" style="margin-left:10px" data-garrison="${id}">+ Cấp quân</button></span></div>`).join('')}</div>`;}
function enlist(){const max=500+game.buildings.barracks*400+game.technology.recruit*50,amount=Math.min(300,max-game.reserve);if(amount<=0)return toast('Kho quân đã đạt giới hạn.');if(!payment({silver:600,grain:450}))return toast('Không đủ 600 đồng và 450 lương.');game.reserve+=amount;countTask('enlist');log(`Chiêu mộ ${amount} quân dự bị.`);save();toast(`Tuyển thành công ${amount} quân!`);render();}

// All coefficients are independently SIMULATED; no proprietary combat formulas.
const P3_VARIANTS=[
 {key:'van',name:'Tiên Phong',style:'pressure',slots:[2,5,8,4,7],desc:'Ba mũi tiền quân; ưu tiên sát thương tuyến trước.'},
 {key:'dieu',name:'Điều Quân',style:'counter',slots:[2,5,1,4,7],desc:'Tập trung giữa sân; ưu tiên khắc chế binh chủng.'},
 {key:'thu',name:'Thủ Hậu',style:'protect',slots:[2,5,0,3,6],desc:'Hai tuyến chắn, hậu quân bảo toàn trị liệu.'},
 {key:'kich',name:'Kỳ Kích',style:'finish',slots:[2,5,8,1,4],desc:'Dồn mũi tiến công, ưu tiên mục tiêu thấp máu.'}
];
const P3_PRESETS=Object.entries(FORMATIONS).flatMap(([formation,data])=>P3_VARIANTS.map(v=>({id:formation+'-'+v.key,formation,title:data.name+' · '+v.name,slots:[...v.slots],style:v.style,desc:v.desc})));
const P3_TIER_NAMES=['','Tân Binh','Tinh Binh','Thiết Quân','Ngự Lâm'];
function p3Hydrate(){
 if(!game.p3TroopTier||typeof game.p3TroopTier!=='object'||Array.isArray(game.p3TroopTier))game.p3TroopTier={};
 for(const [id,lv] of Object.entries(game.p3TroopTier)){
  if(!game.hero[id]||!Number.isInteger(lv)||lv<1||lv>4)delete game.p3TroopTier[id];
 }
 if(!P3_PRESETS.some(p=>p.id===game.p3PresetId))game.p3PresetId='spear-van';
}
const p3OldHydrate=hydrateExtension;
hydrateExtension=function(){p3OldHydrate();p3Hydrate();save();};
const p3OldFresh=fresh;
fresh=function(){const g=p3OldFresh();g.p3TroopTier={};g.p3PresetId='spear-van';return g;};
p3Hydrate();save();
function p3Tier(id){return game.p3TroopTier[id]||1;}
function p3UpgradeCost(next){return {silver:440*next*next,grain:210*next*next,iron:170*next*next};}
function p3Upgrade(id){
 const unit=game.hero[id],tier=p3Tier(id),next=tier+1;
 if(battle||!unit||!game.roster.includes(id)||tier>=4)return false;
 if(game.buildings.barracks<next)return toast('Nâng Doanh Trại tới cấp '+next+' để mở binh chủng.'),false;
 if(!payment(p3UpgradeCost(next)))return toast('Thiếu tài nguyên để luyện quân.'),false;
 game.p3TroopTier[id]=next;
 log('Luyện '+HEROES[id].name+' lên '+P3_TIER_NAMES[next]+'.');
 save();render();toast(HEROES[id].name+' → '+P3_TIER_NAMES[next]);return true;
}
const p3OriginalUnit=p2Unit;
p2Unit=function(id,team,slot,stage){
 const u=p3OriginalUnit(id,team,slot,stage);
 const tier=team==='p'?p3Tier(id):Math.min(4,1+Math.floor((Math.max(1,stage)-1)/8));
 const factor=1+(tier-1)*(team==='p'?.115:.075),guard=1+(tier-1)*(team==='p'?.09:.055);
 u.tier=tier;
 for(const key of ['atk','catk','matk'])u[key]=Math.max(1,Math.round(u[key]*factor));
 for(const key of ['def','tdef','mdef'])u[key]=Math.max(1,Math.round(u[key]*guard));
 u.hp=Math.round(u.hp*(1+(tier-1)*.075));u.maxHp=u.hp;
 // P3 mid-campaign difficulty smoothing, derived from 24x3 deterministic profile runs.
 if(team==='e'&&stage>=13&&stage<=20){
  for(const key of ['atk','catk','matk','def','tdef','mdef'])u[key]=Math.max(1,Math.round(u[key]*.9));
  u.hp=u.maxHp=Math.max(1,Math.round(u.hp*.9));
 }
 return u;
};
// Extended counter is a transparent, capped 3-class cycle plus strategist pressure.
P2_COUNTERS.strategist='infantry';
function p3CounterFactor(a,b){
 if(P2_COUNTERS[a]===b)return 1.22;
 if(P2_COUNTERS[b]===a)return .82;
 return 1;
}
const p3OriginalTarget=p2Target;
p2Target=function(attacker,mode='front'){
 if(!battle||!attacker)return p3OriginalTarget(attacker,mode);
 const opponents=p2CountAlive(attacker.team==='p'?'e':'p');
 if(!opponents.length)return null;
 const bypass=mode==='back'||attacker.troop==='archer';
 const foremost=Math.max(...opponents.map(u=>u.slot%3));
 const rearmost=Math.min(...opponents.map(u=>u.slot%3));
 const eligible=bypass?opponents.filter(u=>u.slot%3===rearmost):opponents.filter(u=>u.slot%3===foremost);
 const preset=P3_PRESETS.find(p=>p.id===game.p3PresetId)||P3_PRESETS[0];
 const style=attacker.team==='p'?preset.style:['pressure','counter','finish','protect'][battle.stage%4];
 const row=Math.floor(attacker.slot/3);
 if(mode==='back')return [...eligible].sort((a,b)=>Math.abs(Math.floor(a.slot/3)-row)-Math.abs(Math.floor(b.slot/3)-row)||a.slot-b.slot)[0];
 function score(t){
  const hpRatio=t.maxHp>0?t.hp/t.maxHp:1;
  const counter=p3CounterFactor(attacker.troop,t.troop);
  const role=(t.troop==='drum'?14:t.troop==='support'?12:t.troop==='strategist'?7:0);
  const lane=Math.abs(Math.floor(t.slot/3)-row);
  let result=role*.45+(1-hpRatio)*20+((counter-1)*34)-lane*2;
  if(style==='finish')result+=(1-hpRatio)*32;
  if(style==='counter')result+=(counter-1)*78;
  if(style==='pressure')result+=(t.maxHp<500?4:0)+(t.troop==='archer'?4:0);
  if(style==='protect')result+=(t.troop==='drum'||t.troop==='support'?9:0);
  if(bypass){result+=(2-t.slot%3)*4+(t.troop==='drum'?8:0);}
  return result;
 }
 return [...eligible].sort((a,b)=>score(b)-score(a)||a.slot-b.slot)[0];
};
function p3AssignPreset(id){
 if(battle)return false;
 const p=P3_PRESETS.find(x=>x.id===id);if(!p)return false;
 // Reorder only owned heroes; do not create units, soldiers, equipment or resources.
 const selected=[...new Set([...game.slots.filter(Boolean),...game.roster])]
  .filter(h=>game.roster.includes(h)&&game.hero[h]&&HEROES[h]&&game.hero[h].troops>=30).slice(0,5);
 if(!selected.length)return toast('Cần ít nhất một tướng có 30 quân.'),false;
 function priority(id){const kind=game.troopModes[id]==='drum'?'drum':HEROES[id].type;return ({infantry:6,cavalry:5,archer:3,strategist:2,support:1,drum:0})[kind]??2;}
 selected.sort((a,b)=>priority(b)-priority(a)||game.roster.indexOf(a)-game.roster.indexOf(b));
 const slots=[...p.slots].sort((a,b)=>b%3-a%3||a-b);
 const updated=Array(9).fill(null);
 selected.forEach((hero,i)=>{updated[slots[i]]=hero;});
 game.slots=updated;game.formation=p.formation;game.p3PresetId=id;selectedHero=null;
 log('Bố trí '+p.title+' với '+selected.length+' tướng.');save();render();return true;
}
const p3OldFormation=renderFormation;
renderFormation=function(){
 const current=P3_PRESETS.find(p=>p.id===game.p3PresetId);
 return p3OldFormation()+`<div class="panel mini-box" style="margin-top:18px"><h3>♟️ P3 · 24 đội hình chiến thuật thực</h3><p class="tiny">6 trận pháp × 4 phương án bố trí. Áp dụng sẽ xếp lại tối đa 5 tướng đã sở hữu, đổi trận pháp và quy tắc chọn mục tiêu AI. Không tạo quân miễn phí.</p><div class="grid-3">${P3_PRESETS.map(p=>`<button class="dark-button" data-p3-preset="${p.id}" style="text-align:left;${p.id===game.p3PresetId?'border-color:#f3d186;background:#514632':''}"><b>${p.title}</b><div class="tiny">${p.desc}</div></button>`).join('')}</div><p class="tiny" style="margin-top:10px">Đang dùng: ${current?.title||'Tiên Phong'} · Bộ &gt; Kỵ &gt; Cung &gt; Bộ; Mưu sĩ ép Bộ. P3 tự động chọn mục tiêu theo đe dọa, khắc chế, máu và vị trí.</p></div>`;
};
const p3OldBarracks=renderBarracks;
renderBarracks=function(){
 return p3OldBarracks()+`<div class="panel mini-box" style="margin-top:18px"><h3>⚔️ P3 · Luyện cấp binh chủng</h3><p class="tiny">Tân Binh → Tinh Binh → Thiết Quân → Ngự Lâm. Mỗi lần tăng công, phòng, HP theo cấp của từng võ tướng. Trả bạc/lương/sắt thật; không tăng số lính. Muốn lên cấp N phải có Doanh Trại cấp N.</p>${game.roster.map(id=>{const lv=p3Tier(id),next=lv+1,need=p3UpgradeCost(next),locked=game.buildings.barracks<next;return `<div class="line"><span>${HEROES[id].icon} ${HEROES[id].name} <b>· ${P3_TIER_NAMES[lv]} ${lv}/4</b></span><span>${lv>=4?'Tối đa':`<small class="cost">${earnedText(need)}</small> <button class="dark-button" data-p3-upgrade="${id}" ${locked?'disabled':''}>${locked?'Cần trại '+next:'Luyện quân'}</button>`}</span></div>`;}).join('')}</div>`;
};
const p3OldStoreReport=p2StoreReport;
p2StoreReport=function(rewards,loot){p3OldStoreReport(rewards,loot);if(battle?.report)battle.report.p3PresetId=game.p3PresetId;};
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-p3-preset],[data-p3-upgrade]');if(!t||t.disabled)return;
 if(t.dataset.p3Preset)p3AssignPreset(t.dataset.p3Preset);
 else if(t.dataset.p3Upgrade)p3Upgrade(t.dataset.p3Upgrade);
});
if(window.__P2_ENABLE_QA__){window.__P3_QA__={presets:P3_PRESETS.map(x=>({...x})),tier:p3Tier,upgrade:p3Upgrade,cost:p3UpgradeCost,assign:p3AssignPreset,target:p2Target,unit:p2Unit,counter:p3CounterFactor,hydrate:p3Hydrate};}

if(window.__P2_ENABLE_QA__){window.__P2_QA__={getGame:()=>structuredClone(game),getBattle:()=>battle?structuredClone({...battle,current:null,fx:[],order:null}):null,
 beginBattle,stepBattle,skipBattle,makeUnit,p2Hit,p2Target,p2OpenReplay,p2LoadReplayFrame,finishBattle,closeBattle,debugBattle:()=>battle,
 useTroop:changeTroopMode,setGame:(g)=>{game=g;hydrateExtension();render();},render,selectTab:(t)=>{tab=t;render();}};}
setInterval(tick,1000);setInterval(save,15000);window.addEventListener('beforeunload',save);tick();render();
})();
</script>
